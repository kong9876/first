<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 수업용 PPT</title><style>
:root{--bg:#f4f7fb;--card:#fff;--line:#dbe4ef;--navy:#17365d;--muted:#667085;--blue:#2563eb;--green:#15803d;--orange:#f59e0b;--purple:#7c3aed;--lb:#eaf3ff;--lg:#ecfdf3;--lp:#f4ecff;--ly:#fff8dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;color:#1f2937}.top{position:sticky;top:0;z-index:10;background:#ffffffef;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.topin{max-width:1180px;margin:auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font-weight:900;cursor:pointer;text-decoration:none;color:#344054}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.wrap{max-width:1180px;margin:auto;padding:18px 14px 70px}.slide{aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 56px;box-shadow:0 12px 30px rgba(31,41,55,.08);display:none;position:relative;overflow:hidden}.slide.active{display:block}.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-weight:900;font-size:14px}.slide h1{font-size:50px;line-height:1.08;letter-spacing:-.05em;margin:18px 0;color:var(--navy)}.slide h2{font-size:34px;letter-spacing:-.04em;margin:10px 0 18px;color:var(--navy)}.lead{font-size:20px;color:#475467;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}.card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.card h3{margin:0 0 8px;color:var(--navy);font-size:21px}.card p,.card li{font-size:17px;line-height:1.55}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:22px}.flow div{text-align:center;background:var(--lb);border-radius:14px;padding:12px 6px;font-weight:900;color:var(--navy)}.flow b{display:block;background:var(--navy);color:#fff;border-radius:10px;margin:0 auto 7px;width:31px;height:31px;line-height:31px}.call{background:var(--ly);border-left:6px solid #f59e0b;border-radius:16px;padding:15px 18px;margin:18px 0;font-size:21px;font-weight:900}.table{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}.cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px;text-align:center;font-size:17px}.head{background:var(--navy);color:#fff;font-weight:900}.notes{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;color:#475467}.bar{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}.bar div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}.counter{font-weight:900;color:#475467}.mini{position:absolute;right:56px;top:44px;background:#2563eb;color:#fff;border-radius:12px;padding:8px 13px;font-weight:900}@media print{.top,.notes,.counter,.bar{display:none}.wrap{padding:0}.slide{display:block!important;page-break-after:always;border:0;box-shadow:none;border-radius:0;width:100vw;height:56.25vw}}@media(max-width:780px){.slide{padding:24px}.slide h1{font-size:34px}.slide h2{font-size:26px}.grid,.grid2{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}.topin{flex-wrap:wrap}}
</style></head><body><header class="top"><div class="topin"><strong>수업용 PPT · 데이터로 발견하는 우리 생활</strong><div><button class="btn" onclick="prev()">← 이전</button><button class="btn primary" onclick="next()">다음 →</button><button class="btn" onclick="print()">인쇄/PDF</button><a class="btn" href="./index.html">학생 웹앱</a><a class="btn" href="./teacher.html">교사용</a></div></div></header><main class="wrap"><section id="deck"></section><div class="bar"><div id="bar"></div></div><p class="counter" id="counter"></p><div id="notes" class="notes"></div></main><script>
const slides = [
{b:'데이터 수업',t:'데이터로 발견하는\n우리 생활',body:'중학교 1학년 정보 · 웹앱 연계 8차시 수업\n편의점으로 배우고 → 거제 날씨에 적용하기',call:'오늘부터 우리는 데이터 탐정입니다.'},
{b:'학습 목표',t:'이번 수업에서 할 일',cards:[['문제를 질문으로','느낌이나 추측을 데이터로 확인 가능한 질문으로 바꿉니다.'],['분석하기','행·열·속성을 이해하고 정렬·필터·평균·그래프를 사용합니다.'],['설명하기','수치 근거로 결론과 한계를 함께 말합니다.']]},
{b:'수업 흐름',t:'8차시 전체 이야기',flow:['데이터 발견','문제 정의','20행 탐색','60행 비교','240행 그래프','점주 결정'],body:'7~8차시는 거제 날씨 데이터로 같은 분석 방법을 적용합니다.'},
{b:'이론 ①',t:'데이터란 무엇일까?',cards:[['문자','상품명, 날씨, 학교명, 메뉴명'],['숫자','가격, 기온, 강수량, 판매량, 학생 수'],['이미지·소리·동영상','사진, 그래프, 안내 방송, 영상 기록']],call:'데이터는 관찰하거나 측정해서 얻은 값이나 사실입니다.'},
{b:'이론 ②',t:'디지털 데이터의 가치',cards:[['저장','많은 데이터를 오래 보관합니다.'],['가공','정렬·필터·평균·그래프로 필요한 정보를 얻습니다.'],['공유','친구와 같은 데이터를 함께 확인하고 비교합니다.']],call:'데이터가 항상 충분한 것은 아니므로 한계도 함께 생각합니다.'},
{b:'이론 ③',t:'데이터 기반 문제 해결 과정',flow:['문제 정의','데이터 선택','수집·관리','구조화','분석·그래프','해석·활용'],call:'우리 수업에서는 이 과정을 편의점과 거제 날씨 문제로 연습합니다.'},
{b:'이론 ④',t:'좋은 데이터 질문 만들기',cards:[['애매한 질문','편의점은 좋은 곳일까?'],['좋은 질문','비 오는 날과 맑은 날의 우산 평균 판매량은 얼마나 다를까?'],['확인 기준','비교 대상, 필요한 데이터, 그래프나 숫자로 확인 가능']],call:'2차시 웹앱: 문제 후보 → 짝 피드백 → 반 공유 → 최종 질문 수정'},
{b:'이론 ⑤',t:'문제에 맞는 데이터 고르기',table:[['문제','필요한 데이터'],['스마트폰 습관','사용 앱, 사용 시간, 사용 횟수'],['날씨 판단','기온, 습도, 강수량, 바람 세기'],['급식 잔반','식단, 급식 인원, 잔반량, 날짜']]},
{b:'이론 ⑥',t:'표로 구조화하기',cards:[['행','하나의 기록. 예: 하루의 편의점 기록'],['열(속성)','같은 종류의 데이터. 예: 날짜, 날씨, 우산 판매량'],['값','행과 열이 만나는 실제 데이터']],call:'3차시 웹앱: 20행 데이터에서 행·열·속성을 찾습니다.'},
{b:'이론 ⑦',t:'범주형과 수치형 데이터',cards:[['범주형','종류나 이름을 나타냅니다. 예: 날씨, 요일, 메뉴명'],['수치형','계산이 가능한 숫자입니다. 예: 기온, 강수량, 판매량'],['먼저 할 일','정렬·평균·그래프 전에 속성의 의미를 확인합니다.']]},
{b:'이론 ⑧',t:'데이터가 커지면 무엇이 달라질까?',flow:['20행\n눈으로 보기','60행\n평균 비교','240행\n그래프 필요','180행\n날씨 적용'],call:'커질수록 분석 도구가 왜 필요한지 직접 경험합니다.'},
{b:'이론 ⑨',t:'정렬과 필터',cards:[['정렬','값의 크기나 순서에 따라 나열합니다.'],['필터','조건에 맞는 데이터만 보이게 합니다.'],['질문','20행은 눈으로 찾을 수 있지만 240행도 가능할까요?']]},
{b:'이론 ⑩',t:'평균으로 비교하기',cards:[['비 오는 날 평균','여러 비 오는 날의 판매량을 대표값으로 요약'],['맑은 날 평균','여러 맑은 날의 판매량을 대표값으로 요약'],['비교','두 대표값의 차이로 경향을 살펴봅니다.']],call:'4차시 웹앱: 60행 데이터로 비/맑음 우산 평균을 비교합니다.'},
{b:'이론 ⑪',t:'그래프는 질문에 맞게 고르기',cards:[['막대그래프','집단 간 크기 비교'],['꺾은선그래프','시간에 따른 변화'],['산점도','두 수치 데이터의 관계']],call:'5차시 웹앱: 240행 데이터에서 그래프를 바꿔 보며 패턴을 찾습니다.'},
{b:'이론 ⑫',t:'해석할 때 조심할 점',cards:[['위험한 표현','비가 오면 무조건 컵라면이 많이 팔린다.'],['좋은 표현','이번 데이터에서는 비 오는 날 평균 컵라면 판매량이 더 높게 나타났다.'],['핵심','관계가 보인다고 해서 반드시 원인이라고 단정하지 않습니다.']]},
{b:'1차시',t:'편의점에도 데이터가 있을까?',cards:[['도입','편의점에서 물건을 사면 어떤 기록이 남을까?'],['활동','생길 수 있는 데이터 3가지 쓰기'],['공유','오늘 내가 만든 데이터 한 가지 나누기']]},
{b:'2차시',t:'내가 해결하고 싶은 문제 만들기',flow:['문제 후보 2개','데이터 질문','필요 데이터','짝 피드백','반 공유','최종 수정'],call:'학생이 스스로 문제를 선정하고 친구 의견을 반영해 질문을 다듬습니다.'},
{b:'3차시',t:'20행 편의점 데이터 살펴보기',cards:[['핵심','한 행은 하루의 기록, 한 열은 같은 종류의 데이터'],['활동','가장 높은 기온 찾기, 비가 온 날만 보기'],['공유','20행이 아니라 200행이면 무엇이 힘들까?']]},
{b:'4차시',t:'정말 비 오는 날 우산이 많이 팔릴까?',cards:[['예상','먼저 결과를 예측합니다.'],['분석','비/맑음 평균 우산 판매량 비교'],['공유','예상과 실제 결과를 수치로 설명합니다.']]},
{b:'5차시',t:'240행 데이터에서 그래프 찾기',cards:[['막대','비/맑음 우산 평균 비교'],['꺾은선','날짜별 방문객 수 변화'],['산점도','기온과 아이스크림 판매량 관계']]},
{b:'6차시',t:'내가 편의점 점주라면?',flow:['날씨 확인','상품 결정','근거 2개','한계 쓰기','반 투표'],call:'데이터는 “정답”이 아니라 “판단의 근거”입니다.'},
{b:'7차시',t:'거제 날씨 데이터에 적용하기',cards:[['정렬','일강수량이 가장 큰 날 찾기'],['비교','일강수량과 최대 시간당 강수량 구분하기'],['공유','편의점 분석에서 다시 쓴 방법 말하기']]},
{b:'8차시',t:'데이터로 우리 지역 이해하기',cards:[['데이터가 알려준 것','강수량, 시간당 강수량, 풍속 등'],['추가 정보','예보, 기상특보, 현장 상황, 학교 일정'],['최종 판단','근거와 한계를 포함한 한 문장']]},
{b:'확장 활동',t:'혼자 연습 · 급식과 거제 중학교 현황',cards:[['급식 데이터','만족도·잔반율·메뉴 종류 분석'],['거제 중학교 현황','학생 수·학급 수·학급당 학생 수 비교'],['활용','빨리 끝난 학생 활동, 복습, 수행평가 전 연습']]},
{b:'운영',t:'웹앱과 종이 활동지 역할 나누기',cards:[['웹앱','데이터 조작·공유·자동 저장'],['종이 활동지','예상·근거·친구 의견·최종 정리'],['교사용 웹앱','PPT 확인·활동지 출력·진도 확인']]},
{b:'공유 활동',t:'우리 반 나눔 약속',cards:[['존중','친구 생각을 놀리거나 평가하지 않습니다.'],['구체화','좋은 질문에는 왜 좋은지 말합니다.'],['수정','친구 아이디어를 참고해 내 질문을 더 구체화합니다.']]},
{b:'평가 연결',t:'수행평가와 연결하기',flow:['탐구 질문','필요 데이터','분석','그래프','해석','활용/한계'],call:'새로운 공통 데이터에 같은 과정을 혼자 적용합니다.'},
{b:'정리',t:'데이터 해석 문장틀',cards:[['비교','A집단 평균은 __, B집단 평균은 __이다.'],['경향','이번 데이터에서는 __할수록 __하는 경향이 나타났다.'],['한계','하지만 이 데이터만으로는 __을 알 수 없다.']]},
{b:'마무리',t:'오늘의 핵심',body:'데이터는 정답을 대신 말해 주지 않습니다.\n하지만 우리가 더 근거 있게 생각하고 설명하도록 도와줍니다.',flow:['질문','데이터','분석','그래프','해석','판단']}
];
let idx=0;function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function render(){const d=document.getElementById('deck');d.innerHTML=slides.map((s,i)=>`<article class="slide ${i===idx?'active':''}">${s.b?`<span class="badge">${esc(s.b)}</span>`:''}<h1>${esc(s.t).replace(/\n/g,'<br>')}</h1>${s.body?`<p class="lead">${esc(s.body).replace(/\n/g,'<br>')}</p>`:''}${s.call?`<div class="call">${esc(s.call)}</div>`:''}${s.cards?`<div class="grid">${s.cards.map(c=>`<div class="card"><h3>${esc(c[0])}</h3><p>${esc(c[1]).replace(/\n/g,'<br>')}</p></div>`).join('')}</div>`:''}${s.flow?`<div class="flow">${s.flow.map((f,j)=>`<div><b>${j+1}</b>${esc(f).replace(/\n/g,'<br>')}</div>`).join('')}</div>`:''}${s.table?tableHtml(s.table):''}</article>`).join('');document.getElementById('counter').textContent=`${idx+1} / ${slides.length}`;document.querySelector('.bar div').style.width=((idx+1)/slides.length*100)+'%';document.getElementById('notes').textContent='교사 메모: 웹앱의 같은 차시를 열고, 종이 활동지의 같은 번호에 핵심 생각과 근거를 기록하게 합니다.'}function tableHtml(rows){let cols=rows[0].length;return `<div class="table" style="grid-template-columns:repeat(${cols},1fr)">${rows.map((r,ri)=>r.map(c=>`<div class="cell ${ri===0?'head':''}">${esc(c)}</div>`).join('')).join('')}</div>`}function next(){idx=Math.min(slides.length-1,idx+1);render()}function prev(){idx=Math.max(0,idx-1);render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')prev()});render();
</script></body></html>
