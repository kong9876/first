<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수행평가 연습 데이터 실험실</title><style>:root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--primary:#2563eb;--text:#1f2937}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}.wrap{max-width:1100px;margin:auto;padding:24px 16px 70px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:14px}.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.controls,.analysis{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:12px 0}select,button{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff}button{cursor:pointer;font-weight:800}.primary{background:var(--primary);color:#fff;border:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.tbl{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #edf0f3;text-align:center}.tbl th{background:#f3f4f6;position:sticky;top:0}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.result{font-weight:900;color:#1f4e78;margin-top:8px}.note{background:#fff8e7;border-left:4px solid #f59e0b;padding:11px 13px;border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 13px;font-weight:800}.secondary{background:#fff;border:1px solid var(--line);color:#344054}@media(max-width:760px){.controls,.analysis{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">정보 교과 · 수행평가 연습</span><h1>우리 학교 학생들의 생활 습관 분석</h1><p>연습 활동지와 동일한 <strong>가상 학생 60명 데이터</strong>입니다. 필터, 정렬, 평균·최댓값·개수 계산을 직접 연습하세요.</p><div class="row"><a class="btn secondary" href="./">공통 수업으로</a><a class="btn secondary" href="./practice.html">기존 혼자 연습으로</a></div></section><section class="panel"><h2>🔎 수행평가 연습 데이터 실험실</h2><div class="note"><strong>연습 순서 예시</strong> · ① 조건으로 필터하기 → ② 열을 선택해 정렬하기 → ③ 계산 기능으로 결과 확인하기</div><div class="controls"><select id="filt"><option value="all">전체</option><option value="g1">1학년</option><option value="g1phone3">1학년 + 스마트폰 3시간 이상</option><option value="phone3">스마트폰 3시간 이상</option><option value="exercise3">운동 3회 이상</option></select><select id="sort"><option value="">정렬 열 선택</option></select><select id="dir"><option value="asc">오름차순</option><option value="desc">내림차순</option></select><button onclick="resetLab()">초기화</button></div><div class="tablewrap"><table class="tbl"><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="pager"><button onclick="move(-1)">← 이전</button><span id="pageInfo"></span><button onclick="move(1)">다음 →</button></div><h3>🧮 계산으로 확인하기</h3><div class="analysis"><select id="metric"></select><select id="cond"><option value="all">전체</option><option value="g1">1학년</option><option value="g1phone3">1학년 + 스마트폰 3시간 이상</option><option value="phone3">스마트폰 3시간 이상</option><option value="exercise3">운동 3회 이상</option></select><select id="stat"><option value="avg">평균</option><option value="max">최댓값</option><option value="min">최솟값</option><option value="count">개수</option></select><button class="primary" onclick="analyze()">계산</button></div><div id="res" class="result"></div></section></main><script>const DATA=[["S01",1,2.0,7.2,3,1.5,4],["S02",1,3.2,6.9,4,0.7,4],["S03",1,3.2,7.4,4,2.3,5],["S04",1,3.1,6.4,4,1.0,4],["S05",1,3.5,6.7,3,2.4,4],["S06",1,2.1,8.0,4,2.5,5],["S07",1,4.2,7.6,3,2.7,4],["S08",1,1.6,7.8,2,2.1,5],["S09",1,1.3,8.3,3,2.0,4],["S10",1,0.8,9.4,3,1.9,5],["S11",1,3.2,7.6,6,1.6,4],["S12",1,3.5,6.4,4,1.2,3],["S13",1,3.1,6.9,2,1.1,5],["S14",1,2.8,7.1,2,1.3,4],["S15",1,4.8,6.7,2,2.0,4],["S16",1,3.7,7.4,2,2.1,4],["S17",1,1.3,7.9,2,1.4,5],["S18",1,3.9,7.6,3,1.7,4],["S19",1,3.2,7.5,2,1.2,4],["S20",1,4.3,6.3,2,0.7,4],["S21",2,2.0,9.4,2,2.6,4],["S22",2,3.3,7.7,4,2.1,4],["S23",2,3.3,6.7,5,1.9,5],["S24",2,3.5,6.8,3,1.7,4],["S25",2,3.4,5.9,4,0.7,5],["S26",2,2.6,7.6,4,2.5,4],["S27",2,0.8,9.1,1,2.8,5],["S28",2,3.3,7.7,0,2.2,3],["S29",2,2.0,8.1,4,2.2,5],["S30",2,1.3,8.2,2,2.7,4],["S31",2,3.7,7.7,3,3.1,5],["S32",2,2.4,7.7,3,2.1,5],["S33",2,3.3,8.1,4,1.4,4],["S34",2,1.7,9.5,5,2.4,5],["S35",2,3.9,6.2,3,2.6,3],["S36",2,3.0,7.1,3,2.3,3],["S37",2,2.4,7.4,4,1.7,4],["S38",2,2.3,6.4,2,2.6,5],["S39",2,4.1,7.0,1,1.9,3],["S40",2,3.4,6.8,3,2.7,5],["S41",3,2.6,7.7,3,1.8,5],["S42",3,4.5,6.8,1,2.7,4],["S43",3,3.1,7.0,3,2.7,5],["S44",3,4.2,6.1,4,1.2,4],["S45",3,5.6,6.3,3,1.1,4],["S46",3,1.8,7.4,2,2.7,4],["S47",3,2.1,8.2,0,2.4,4],["S48",3,3.1,8.1,1,3.4,3],["S49",3,6.0,7.0,6,2.9,4],["S50",3,4.2,7.2,1,2.5,3],["S51",3,3.1,7.3,4,1.2,4],["S52",3,3.5,7.8,4,3.1,4],["S53",3,3.6,5.7,1,2.8,3],["S54",3,5.4,6.4,5,2.8,4],["S55",3,4.4,6.7,1,2.9,3],["S56",3,3.8,7.0,3,2.0,4],["S57",3,5.4,6.1,1,3.5,4],["S58",3,4.2,7.4,1,3.3,4],["S59",3,3.6,6.4,2,2.5,3],["S60",3,4.6,6.6,2,4.3,4]].map(x=>({id:x[0],grade:x[1],phone:x[2],sleep:x[3],exercise:x[4],study:x[5],satisfaction:x[6]}));const H=[['id','학생번호'],['grade','학년'],['phone','스마트폰 사용시간(시간)'],['sleep','수면시간(시간)'],['exercise','운동 횟수(회/주)'],['study','공부시간(시간)'],['satisfaction','학교생활 만족도(1~5)']];let page=0,filter='all',sortKey='',asc=true;const PAGE=15;function pick(a,f){return a.filter(r=>f==='all'||f==='g1'&&r.grade===1||f==='g1phone3'&&r.grade===1&&r.phone>=3||f==='phone3'&&r.phone>=3||f==='exercise3'&&r.exercise>=3)}function rows(){let a=pick(DATA,filter).slice();if(sortKey)a.sort((x,y)=>typeof x[sortKey]==='string'?(asc?x[sortKey].localeCompare(y[sortKey]):y[sortKey].localeCompare(x[sortKey])):(asc?x[sortKey]-y[sortKey]:y[sortKey]-x[sortKey]));return a}function render(){let a=rows(),pages=Math.max(1,Math.ceil(a.length/PAGE));page=Math.min(page,pages-1);head.innerHTML='<tr>'+H.map(h=>`<th>${h[1]}</th>`).join('')+'</tr>';body.innerHTML=a.slice(page*PAGE,(page+1)*PAGE).map(r=>'<tr>'+H.map(h=>`<td>${r[h[0]]}</td>`).join('')+'</tr>').join('');pageInfo.textContent=`${page+1}/${pages}쪽 · ${a.length}행`}function move(n){let pages=Math.max(1,Math.ceil(rows().length/PAGE));page=Math.max(0,Math.min(pages-1,page+n));render()}function resetLab(){page=0;filter='all';sortKey='';asc=true;filt.value='all';sort.value='';dir.value='asc';render()}filt.onchange=e=>{filter=e.target.value;page=0;render()};sort.onchange=e=>{sortKey=e.target.value;page=0;render()};dir.onchange=e=>{asc=e.target.value==='asc';render()};sort.innerHTML='<option value="">정렬 열 선택</option>'+H.map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');metric.innerHTML=H.filter(h=>h[0]!=='id').map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');function analyze(){let a=pick(DATA,cond.value),m=metric.value,s=stat.value;if(s==='count'){res.textContent=`결과: ${a.length}명`;return}let v=a.map(r=>Number(r[m]));let x=s==='avg'?v.reduce((p,c)=>p+c,0)/v.length:s==='max'?Math.max(...v):Math.min(...v);res.textContent=`결과: ${Math.round(x*10)/10}`}render();</script></body></html>
