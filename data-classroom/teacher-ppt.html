<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 수업 교사용 PPT</title><style>:root{--bg:#f4f7fb;--card:#fff;--line:#dbe4ef;--navy:#17365d;--muted:#667085;--blue:#e8f2ff;--green:#ebf8ee;--purple:#f0eaff;--yellow:#fff8dc;--orange:#fff2e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#1f2937}.top{position:sticky;top:0;background:#ffffffef;border-bottom:1px solid var(--line);z-index:5}.topin{max-width:1180px;margin:auto;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.wrap{max-width:1180px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font-weight:900;cursor:pointer;text-decoration:none;color:#344054}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.slide{aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:20px;padding:42px 54px;box-shadow:0 12px 30px rgba(31,41,55,.08);display:none}.slide.active{display:block}.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-weight:900;font-size:14px}.slide h1{font-size:52px;line-height:1.08;letter-spacing:-.05em;margin:18px 0 18px;color:var(--navy)}.slide h2{font-size:34px;letter-spacing:-.04em;margin:10px 0 20px;color:var(--navy)}.lead{font-size:20px;color:#475467}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}.card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.card h3{margin:0 0 9px;color:var(--navy);font-size:21px}.card p,.card li{font-size:17px;line-height:1.55}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:24px}.flow div{text-align:center;background:var(--blue);border-radius:14px;padding:12px 6px;font-weight:900;color:var(--navy)}.flow b{display:block;background:var(--navy);color:#fff;border-radius:10px;margin:0 auto 8px;width:32px;height:32px;line-height:32px}.call{background:var(--yellow);border-left:6px solid #f59e0b;border-radius:16px;padding:16px 18px;margin:18px 0;font-size:21px;font-weight:900}.notes{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;color:#475467}.counter{font-weight:900;color:#475467}.bar{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}.bar div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}@media print{.top,.notes,.controls{display:none}.wrap{padding:0}.slide{display:block!important;page-break-after:always;border:0;box-shadow:none;border-radius:0;width:100vw;height:56.25vw}}</style></head><body><header class="top"><div class="topin"><strong>교사용 PPT · 데이터로 발견하는 우리 생활</strong><div class="controls"><button class="btn" onclick="prev()">← 이전</button><button class="btn primary" onclick="next()">다음 →</button><button class="btn" onclick="print()">인쇄/PDF</button><a class="btn" href="./teacher.html">교사용 대시보드</a></div></div></header><main class="wrap"><section id="deck"></section><div class="bar"><div id="bar"></div></div><p class="counter" id="counter"></p><div class="notes" id="notes"></div></main><script>const slides=[
{t:'데이터로 발견하는\n우리 생활',sub:'중학교 1학년 정보 · 8차시 데이터 분석 수업',badge:'편의점으로 배우고 → 거제 날씨에 적용하기',body:'학생은 웹앱에서 활동하고, 종이 활동지에는 핵심 생각과 근거를 기록합니다.',note:'수업 시작 전 학생용 시작 페이지와 교사용 대시보드를 함께 열어 둡니다.'},
{t:'수업 설계의 핵심',badge:'기능보다 근거',body:'학생에게는 “데이터 탐정이 되어 생활 속 문제를 해결한다”는 이야기로 안내합니다.',cards:[['왜 편의점?','학생 생활과 가깝고 날씨·요일·상품 판매량을 비교하기 쉽습니다.'],['왜 공유?','친구의 문제와 해석을 보며 자신의 질문을 더 구체화합니다.'],['왜 날씨 전환?','배운 분석 방법이 새로운 데이터에도 통하는지 확인합니다.']],note:'처음부터 여러 주제를 자유롭게 주지 않고, 공통 주제로 함께 연습합니다.'},
{t:'8차시 전체 흐름',badge:'한 주제에서 깊게 → 다른 주제로 전이',flow:['생활 속 데이터','문제 정의','20행 살펴보기','60행 비교','240행 그래프','점주 의사결정'],body:'7~8차시는 거제 날씨 데이터로 같은 분석 방법을 적용합니다.',note:'1~6차시는 편의점, 7~8차시는 거제 날씨. 이후 급식·거제 중학교 현황으로 혼자 연습합니다.'},
{t:'차시 안의 화면 흐름',badge:'이동 없이 한 화면에서',flow:['생각 열기','함께 배우기','직접 활동','우리 반 나눔','돌아보기','다음 연결'],body:'공통수업과 공유활동을 분리하지 않고, 수업 순서대로 이어지게 구성했습니다.',note:'학생이 다른 페이지로 이동하지 않아도 되므로 수업 흐름을 잃지 않습니다.'},
{t:'1차시 · 데이터 발견',badge:'편의점에도 데이터가 있을까?',cards:[['도입 발문','편의점에서 물건을 사면 어떤 기록이 남을까?'],['학생 활동','상품명·가격·시간·날짜 등 숫자/문자 데이터 찾기'],['공유 활동','오늘 내가 만든 데이터 한 가지를 우리 반에 공유']],note:'데이터의 정의보다 생활 속 예시에서 시작합니다.'},
{t:'2차시 · 학생이 문제 선정',badge:'문제 후보 → 짝 피드백 → 공유 → 수정',cards:[['문제 후보','급식, 편의점, 날씨, 거제 중학교 현황 등 관심 문제를 2개 만듭니다.'],['데이터 질문','비교 대상과 필요한 데이터가 드러나게 질문을 바꿉니다.'],['우리 반 나눔','친구 질문을 읽고 탐구해 보고 싶은 질문에 반응합니다.']],note:'2차시는 학생 주도성이 가장 잘 드러나는 차시입니다. 질문 자체를 평가하지 말고 다듬는 과정을 강조합니다.'},
{t:'3차시 · 20행 데이터',badge:'작은 데이터로 표 구조 이해',cards:[['행','하루의 편의점 기록 하나'],['열','날짜·날씨·기온·우산판매 같은 속성'],['공유 질문','20행이 아니라 200행이면 무엇이 힘들까?']],note:'정렬·필터를 처음 다루는 차시입니다. 계산보다 표 구조를 우선합니다.'},
{t:'4차시 · 평균 비교',badge:'비 오는 날 우산이 정말 더 팔릴까?',cards:[['예상하기','먼저 비 오는 날 잘 팔릴 상품을 예상합니다.'],['분석하기','60행 데이터로 비/맑음 평균 우산 판매량을 비교합니다.'],['공유하기','예상과 실제 결과를 수치가 들어간 문장으로 공유합니다.']],note:'필터+평균으로 시작하고, AVERAGEIF는 교사가 보여주는 정도로 충분합니다.'},
{t:'5차시 · 그래프 선택',badge:'240행 데이터에서 패턴 찾기',cards:[['막대그래프','집단 간 평균 비교'],['꺾은선그래프','시간에 따른 변화'],['산점도','두 수치 데이터의 관계']],body:'공유 활동: 그래프에서 발견한 사실을 원인 단정 없이 한 문장으로 씁니다.',note:'그래프를 예쁘게 만드는 것보다 질문에 맞는 그래프를 고르는 이유를 묻습니다.'},
{t:'6차시 · 점주 의사결정',badge:'데이터 → 판단',cards:[['결정','우산 발주를 늘릴지, 유지할지, 줄일지 선택합니다.'],['근거','수치가 들어간 근거 2개 이상을 씁니다.'],['한계','계절·행사·가격 등 추가로 필요한 데이터를 생각합니다.']],note:'수치 근거와 한계를 함께 쓰게 하면 데이터 리터러시 수준이 높아집니다.'},
{t:'7차시 · 날씨 데이터 적용',badge:'방법의 전이',cards:[['정렬','일강수량이 가장 큰 날 찾기'],['비교','일강수량과 최대 시간당 강수량 구분하기'],['공유','편의점 분석에서 그대로 쓸 수 있었던 방법 나누기']],note:'새 기능을 배우지 말고 기존 방법을 새 데이터에 적용하는 데 초점을 둡니다.'},
{t:'8차시 · 지역 문제 이해',badge:'데이터와 추가 정보',cards:[['데이터가 알려준 것','강수량·시간당 강수량·풍속 등 확인 가능한 사실'],['추가 정보','예보·기상특보·현장 상황·학교 일정'],['최종 판단','근거와 한계를 포함한 한 문장']],note:'공식 안전 기준을 만들게 하기보다, 어떤 데이터를 확인해야 하는지 판단하게 합니다.'},
{t:'혼자 연습',badge:'급식·거제 중학교 현황',cards:[['급식 데이터','만족도·잔반율·메뉴 종류를 분석하여 제안까지 작성합니다.'],['거제 중학교 현황','학교별 학생수·학급수·학급당 학생수를 비교합니다.'],['운영 방법','빨리 끝난 학생 또는 복습 과제로 사용합니다.']],note:'거제 중학교 현황은 공개 자료를 수업용으로 재구성한 데이터입니다.'},
{t:'웹앱과 종이 활동지',badge:'역할 분리',cards:[['웹앱','데이터 조작·공유·자동 저장'],['종이 활동지','핵심 생각·근거·친구 의견 기록'],['교사용 웹앱','PPT·활동지 출력·학생 진도 확인']],note:'학생이 모든 것을 화면에 쓰기보다 종이에 핵심 문장을 남기게 하면 수업 관리가 쉬워집니다.'},
{t:'45분 운영 예시',badge:'필수와 선택 활동 구분',flow:['5분 질문','10분 시범','15분 활동','8분 나눔','5분 정리','2분 연결'],body:'활동이 많을 때는 필수 활동만 먼저 끝내고, 추가 활동은 빨리 끝난 학생에게 제공합니다.',note:'웹앱의 공유 활동은 매차시 모두 하지 않아도 됩니다. 수업 상황에 맞게 선택합니다.'},
{t:'자주 겪는 어려움',badge:'중1 학생 대응',cards:[['행·열 혼동','한 줄은 하루 기록, 한 칸은 그날의 값으로 반복 설명'],['함수 오류','함수 암기보다 분석 도구와 예시 식 제공'],['원인 단정','“이번 데이터에서는 ~한 경향” 문장틀 제공']],note:'기능 오류가 나면 분석 질문으로 돌아오게 하는 것이 좋습니다.'},
{t:'수행평가 연결',badge:'새로운 공통 데이터로 평가',flow:['질문','데이터','분석','그래프','해석','활용/한계'],body:'수업에서 배운 흐름을 새로운 데이터에 혼자 적용할 수 있는지 확인합니다.',note:'평가 데이터는 연습과 구조는 비슷하되 숫자와 주제는 다르게 준비합니다.'},
{t:'수업 전 체크리스트',badge:'교사용',body:'□ 학생 시작 페이지 게시\n□ Apps Script 제출/공유 서버 연결 확인\n□ A4 종이 활동지 출력\n□ PPT 또는 웹 PPT 열기\n□ 2차시 공유 활동 운영 방식 안내\n□ 수행평가 데이터 별도 보관',note:'교사용 대시보드의 수업자료 영역에서 PPT와 활동지를 바로 열 수 있습니다.'}
];let idx=0;function render(){deck.innerHTML=slides.map((s,i)=>`<article class="slide ${i===idx?'active':''}"><span class="badge">${s.badge||''}</span><h1>${s.t}</h1>${s.sub?`<p class="lead">${s.sub}</p>`:''}${s.body?`<p class="lead">${s.body.replace(/\n/g,'<br>')}</p>`:''}${s.flow?`<div class="flow">${s.flow.map((f,j)=>`<div><b>${j+1}</b>${f}</div>`).join('')}</div>`:''}${s.cards?`<div class="${s.cards.length===2?'grid2':'grid'}">${s.cards.map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`:''}</article>`).join('');counter.textContent=`${idx+1} / ${slides.length}`;bar.style.width=((idx+1)/slides.length*100)+'%';notes.textContent='교사용 메모: '+(slides[idx].note||'');}function next(){idx=Math.min(slides.length-1,idx+1);render()}function prev(){idx=Math.max(0,idx-1);render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});render();</script></body></html>
