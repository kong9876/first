<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 수업 시작</title><style>body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui;background:#f5f7fb;color:#1f2937}.wrap{max-width:860px;margin:auto;padding:42px 18px}.hero,.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px}.hero{padding:32px;background:linear-gradient(135deg,#eaf3ff,#fff 65%,#ecfdf5)}h1{letter-spacing:-.04em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{padding:22px}.btn{display:inline-block;text-decoration:none;background:#2563eb;color:#fff;padding:11px 15px;border-radius:12px;font-weight:900}.btn.alt{background:#7c3aed}.small{color:#667085;font-size:14px}.note{background:#fff8e7;border-left:4px solid #f59e0b;padding:12px 14px;border-radius:12px;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="small">중학교 정보 · 데이터 분석</div><h1>데이터로 발견하는 우리 생활</h1><p>수업 시간에는 공통 수업으로 함께 배우고, 수업 후에는 급식·거제 중학교 데이터로 혼자 연습합니다.</p><div class="note">같은 노트북과 같은 브라우저에서 두 활동을 진행하면 공통 수업 기록과 혼자 연습 기록을 함께 제출할 수 있습니다.</div></section><div class="grid"><section class="card"><h2>① 공통 수업</h2><p>편의점 → 거제 날씨 데이터로 8차시 학습</p><a id="common" class="btn" href="./">공통 수업 열기</a></section><section class="card"><h2>② 혼자 연습·제출</h2><p>급식 + 거제 중학교 현황 데이터 연습, 전체 기록 제출</p><a id="practice" class="btn alt" href="./practice.html">혼자 연습 열기</a></section></div></main><script>const q=location.search;document.getElementById('common').href='./'+q;document.getElementById('practice').href='./practice.html'+q;</script></body></html>
