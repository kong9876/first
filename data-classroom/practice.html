<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 혼자 연습</title><style>
:root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#667085;--primary:#2563eb;--ok:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#fffef;border-bottom:1px solid var(--line)}.topin,.wrap{max-width:1080px;margin:auto}.topin{padding:11px 16px;display:flex;justify-content:space-between;align-items:center}.wrap{padding:24px 16px 70px}.hero,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:20px}.hero{padding:28px;background:linear-gradient(135deg,#eef2ff,#fff 65%,#ecfdf5)}h1,h2,h3{letter-spacing:-.03em}.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.small{font-size:13px;color:var(--muted)}.btn{border:0;border-radius:12px;padding:9px 13px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--primary);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.success{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px}.row{display:flex;gap:8px;flex-wrap:wrap}.profile{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:8px;margin:12px 0}.profile input,.field input,.field textarea,.controls select,.analysis select{border:1px solid #cbd5e1;border-radius:10px;padding:9px;width:100%;background:#fff}.field textarea{min-height:80px}.hidden{display:none}.panel{padding:22px}.lab{border:1px solid #bfd4ea;background:#fbfdff;border-radius:16px;padding:15px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin:10px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}.tbl{border-collapse:collapse;width:100%;min-width:800px;font-size:12px}.tbl th,.tbl td{padding:7px;border-bottom:1px solid #edf0f3;text-align:center}.tbl th{background:#f3f4f6;position:sticky;top:0}.analysis{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin-top:10px}.result{font-weight:900;color:#1f4e78;margin-top:8px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:800}.choice .sel{background:#eff6ff;border-color:#93c5fd}.feedback{font-size:13px;font-weight:800;margin-top:4px}.ok{color:var(--ok)}.no{color:var(--bad)}.note{background:#fff8e7;border-left:4px solid #f59e0b;padding:11px 13px;border-radius:11px}.source{font-size:12px;color:#475467;margin-top:10px}.source a{color:#1d4ed8}.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}@media(max-width:760px){.grid,.profile,.controls,.analysis{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="topin"><strong>데이터 혼자 연습</strong><a class="btn secondary" href="./">공통 수업으로</a></div></header><main class="wrap"><section id="home"><div class="hero"><span class="badge">수업 후 스스로 다시 해보기</span><h1>급식과 거제 중학교 데이터로<br>혼자 연습해 보자</h1><p class="small">공통 수업에서 배운 정렬·필터·평균·해석 방법을 다른 데이터에 적용합니다. 같은 브라우저를 사용하면 공통 수업의 학생 정보와 기록을 함께 읽을 수 있습니다.</p><div class="profile"><input id="studentClass" placeholder="반"><input id="studentNo" placeholder="번호"><input id="studentName" placeholder="이름"></div><div class="row"><button class="btn secondary" onclick="saveProfile()">학생 정보 저장</button><button class="btn success" onclick="showSubmit()">전체 기록 제출/백업</button></div></div><div class="grid" style="margin-top:14px"><div class="card"><span class="badge">120행</span><h3>🍱 급식 데이터</h3><p>만족도와 잔반율의 관계를 분석합니다.</p><button class="btn primary" onclick="openPractice('meal')">연습 시작</button></div><div class="card"><span class="badge">실제 공개 자료 20개교</span><h3>🏫 거제 중학교 현황</h3><p>학교별 학급수와 학생수를 비교합니다.</p><button class="btn primary" onclick="openPractice('schools')">연습 시작</button><div class="source">출처: 거제교육지원청, 2026.3.1. 기준</div></div></div></section><section id="detail" class="hidden"><div id="box" class="panel"></div></section><section id="submit" class="hidden"><div class="panel"><span class="badge">제출/백업</span><h2>공통 수업 + 혼자 연습 기록</h2><div id="status" class="note"></div><pre id="summary" style="white-space:pre-wrap;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;max-height:360px;overflow:auto"></pre><div class="row"><button class="btn primary" onclick="directSubmit()">교사에게 웹으로 제출</button><button class="btn secondary" onclick="downloadCSV()">통합 CSV 백업</button><button class="btn secondary" onclick="showHome()">← 돌아가기</button></div></div></section></main><script>
const COMMON_ANS='data-classroom-interactive-v1',COMMON_PROFILE='data-classroom-profile-v1',COMMON_DONE='data-classroom-done-v1',PKEY='data-classroom-practice-v2',BASE='data-classroom-practice';const qp=new URLSearchParams(location.search),API=qp.get('api')||localStorage.getItem(BASE+'-api')||'',TOKEN=qp.get('token')||localStorage.getItem(BASE+'-token')||'';if(API)localStorage.setItem(BASE+'-api',API);if(TOKEN)localStorage.setItem(BASE+'-token',TOKEN);let profile=JSON.parse(localStorage.getItem(COMMON_PROFILE)||'{"studentClass":"","studentNo":"","studentName":""}'),commonAnswers=JSON.parse(localStorage.getItem(COMMON_ANS)||'{}'),commonDone=JSON.parse(localStorage.getItem(COMMON_DONE)||'[]'),practice=JSON.parse(localStorage.getItem(PKEY)||'{}'),current='',page=0,sortKey='',asc=true,filter='all';const PAGE=15;
function rng(seed){let s=seed>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function fmt(d){return d.toISOString().slice(0,10)}function dow(d){return ['일','월','화','수','목','금','토'][d.getDay()]}
function makeMeal(n=120){const r=rng(202603),menus=[['치킨마요덮밥','덮밥'],['비빔밥','밥류'],['카레라이스','밥류'],['돈가스','양식'],['잔치국수','면류'],['불고기덮밥','덮밥'],['짜장밥','밥류'],['떡볶이','분식'],['김치볶음밥','밥류'],['닭갈비','한식'],['우동','면류'],['햄버거','양식']];let out=[],d=new Date('2026-03-02T00:00:00'),i=0;while(out.length<n){let x=new Date(d);x.setDate(d.getDate()+i++);if([0,6].includes(x.getDay()))continue;let [menu,cat]=menus[Math.floor(r()*menus.length)],base={'덮밥':4.05,'양식':4.15,'면류':3.75,'분식':4.2,'밥류':3.65,'한식':3.8}[cat],sat=Math.round(clamp(base+(r()-.5)*1.1,2.5,5)*10)/10,left=Math.round(clamp(34-(sat-3)*10+(r()-.5)*12,5,45)*10)/10,served=Math.round(300+(r()-.5)*45),temp=Math.round((12+18*Math.sin((out.length/120)*Math.PI)+(r()-.5)*5)*10)/10;out.push({date:fmt(x),weekday:dow(x),menu,category:cat,served,satisfaction:sat,leftover:left,temp})}return out}const MEAL=makeMeal(),SCHOOLS=[['공립','거제고현중학교',28,731,'거제중앙로7길19'],['공립','거제상문중학교',27,728,'상동5길 57-25'],['공립','거제장평중학교',23,588,'장평4로 40'],['공립','거제제일중학교',7,130,'거제면 읍내로13길 12'],['공립','거제중앙중학교',38,1011,'중곡로2길51'],['공립','계룡중학교',30,800,'고현로14길37'],['공립','동부중학교',3,36,'동부면 동부로28-6'],['공립','성포중학교',7,100,'사등면 가조로46'],['공립','수월중학교',35,940,'해명로 70'],['공립','신현중학교',24,630,'서문로1길17'],['공립','연초중학교',7,132,'연초면 죽토양지1길 26'],['공립','옥포성지중학교',24,604,'거제대로3699'],['공립','옥포중학교',30,753,'옥포대첩로99'],['공립','지세포중학교',10,163,'일운면 지세포3길 3'],['공립','하청중학교',3,53,'하청면 서리1길 5'],['사립','거제중학교',24,676,'아주로3길 61'],['사립','둔덕중학교',6,139,'둔덕면 하둔3길 7-3'],['사립','외포중학교',3,73,'장목면 옥포대첩로 942'],['사립','장목예술중학교',6,86,'장목면 옥포대첩로 1595-8'],['사립','해성중학교',23,639,'두모길 4-2']].map(x=>({type:x[0],school:x[1],classes:x[2],students:x[3],perClass:Math.round(x[3]/x[2]*10)/10,address:x[4]}));const DEF={meal:{title:'🍱 급식 데이터 혼자 연습',data:MEAL,headers:[['date','날짜'],['weekday','요일'],['menu','주메뉴'],['category','종류'],['served','급식인원'],['satisfaction','만족도'],['leftover','잔반율(%)'],['temp','기온(℃)']],fields:[['m1','잔반율이 가장 낮은 날의 주메뉴는?','text'],['m2','만족도 4.0 이상인 날의 평균 잔반율(%)은?','number'],['m3','만족도가 높아질수록 잔반율은 대체로 어떻게 변하는가?','choice',['낮아지는 경향','높아지는 경향','관계가 전혀 없음'],0],['m4','급식 담당자에게 데이터에 근거한 제안을 적어 보자.','textarea']]},schools:{title:'🏫 거제 중학교 현황 혼자 연습',data:SCHOOLS,headers:[['type','설립'],['school','학교명'],['classes','학급수'],['students','학생수'],['perClass','학급당학생수'],['address','주소']],fields:[['s1','학생수가 가장 많은 학교는?','text'],['s2','공립 중학교는 몇 개교인가?','number'],['s3','사립 중학교는 몇 개교인가?','number'],['s4','학교별 학생수 차이를 원인 추측 없이 데이터 사실로만 한 문장 쓰기','textarea']]}};
function showOnly(id){['home','detail','submit'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function showHome(){showOnly('home');loadProfile()}function saveProfile(){profile={studentClass:studentClass.value.trim(),studentNo:studentNo.value.trim(),studentName:studentName.value.trim()};localStorage.setItem(COMMON_PROFILE,JSON.stringify(profile));alert('저장했습니다.')}function loadProfile(){studentClass.value=profile.studentClass||'';studentNo.value=profile.studentNo||'';studentName.value=profile.studentName||''}function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function attr(s){return String(s??'').replace(/"/g,'&quot;')}function saveP(){localStorage.setItem(PKEY,JSON.stringify(practice))}function setP(id,v){practice[current]=practice[current]||{answers:{},completed:false};practice[current].answers[id]=v;saveP()}
function openPractice(k){current=k;page=0;sortKey='';asc=true;filter='all';let d=DEF[k],a=practice[k]?.answers||{};showOnly('detail');box.innerHTML=`<span class="badge">혼자 연습</span><h2>${d.title}</h2><p class="small">종이 활동지의 혼자 연습 ${k==='meal'?'A':'B'}와 같은 문제입니다.</p>${k==='schools'?'<div class="source">실제 공개 자료 · <a href="https://gjedu.gne.go.kr/gjedu/cm/cntnts/cntntsView.do?cntntsId=465&mi=731" target="_blank">거제교육지원청 원자료</a></div>':'<div class="source">수업용 가상 급식 데이터입니다.</div>'}<div class="lab"><h3>🔎 데이터 실험실</h3><div class="controls"><select id="sort"></select><select id="filt"></select><select id="dir"><option value="asc">오름차순</option><option value="desc">내림차순</option></select><button onclick="resetLab()">초기화</button></div><div class="tablewrap"><table class="tbl"><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="pager"><button class="btn secondary" onclick="move(-1)">← 이전</button><span id="pageInfo" class="small"></span><button class="btn secondary" onclick="move(1)">다음 →</button></div><div class="analysis"><select id="metric"></select><select id="cond"></select><select id="stat"><option value="avg">평균</option><option value="max">최댓값</option><option value="min">최솟값</option><option value="count">개수</option></select><button onclick="analyze()">분석</button></div><div id="res" class="result"></div></div><h3>✍️ 문제 해결</h3>${d.fields.map(f=>field(f,a[f[0]])).join('')}<div class="row"><button class="btn secondary" onclick="check()">정답 확인</button><button class="btn primary" onclick="complete()">연습 완료</button><button class="btn secondary" onclick="showHome()">목록으로</button></div>`;sort.onchange=e=>{sortKey=e.target.value;page=0;renderLab()};filt.onchange=e=>{filter=e.target.value;page=0;renderLab()};dir.onchange=e=>{asc=e.target.value==='asc';renderLab()};renderLab()}
function field(f,v=''){let [id,label,type,choices]=f;if(type==='choice')return `<div class="field"><label>${label}</label><div class="choice">${choices.map((c,i)=>`<button class="${String(v)===String(i)?'sel':''}" onclick="setP('${id}',${i});openPractice('${current}')">${c}</button>`).join('')}</div><div id="fb_${id}" class="feedback"></div></div>`;if(type==='textarea')return `<div class="field"><label>${label}</label><textarea oninput="setP('${id}',this.value)">${esc(v)}</textarea><div id="fb_${id}" class="feedback"></div></div>`;return `<div class="field"><label>${label}</label><input type="${type==='number'?'number':'text'}" step="any" value="${attr(v)}" oninput="setP('${id}',this.value)"><div id="fb_${id}" class="feedback"></div></div>`}
function filters(){return current==='meal'?[['all','전체'],['high','만족도 4.0 이상'],['low','잔반율 15% 이하'],['rice','밥류/덮밥'],['noodle','면류']]:[['all','전체'],['공립','공립'],['사립','사립'],['large','학생수 500명 이상'],['small','학생수 150명 미만']]}function labData(){let a=DEF[current].data.slice();if(filter!=='all')a=a.filter(r=>current==='meal'?(filter==='high'?r.satisfaction>=4:filter==='low'?r.leftover<=15:filter==='rice'?['밥류','덮밥'].includes(r.category):r.category==='면류'):(filter==='large'?r.students>=500:filter==='small'?r.students<150:r.type===filter));if(sortKey)a.sort((x,y)=>{let A=x[sortKey],B=y[sortKey];return typeof A==='string'?(asc?String(A).localeCompare(String(B)):String(B).localeCompare(String(A))):(asc?A-B:B-A)});return a}function renderLab(){let d=DEF[current],hs=d.headers;sort.innerHTML='<option value="">정렬 열 선택</option>'+hs.map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');filt.innerHTML=filters().map(x=>`<option value="${x[0]}" ${filter===x[0]?'selected':''}>${x[1]}</option>`).join('');metric.innerHTML=hs.filter(h=>!['date','weekday','menu','category','type','school','address'].includes(h[0])).map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');cond.innerHTML=filters().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');let a=labData(),pages=Math.max(1,Math.ceil(a.length/PAGE));page=Math.min(page,pages-1),slice=a.slice(page*PAGE,(page+1)*PAGE);head.innerHTML='<tr>'+hs.map(h=>`<th>${h[1]}</th>`).join('')+'</tr>';body.innerHTML=slice.map(r=>'<tr>'+hs.map(h=>`<td>${r[h[0]]}</td>`).join('')+'</tr>').join('');pageInfo.textContent=`${page+1}/${pages}쪽 · ${a.length}행`}function move(n){let pages=Math.max(1,Math.ceil(labData().length/PAGE));page=clamp(page+n,0,pages-1);renderLab()}function resetLab(){page=0;sortKey='';asc=true;filter='all';renderLab()}function condData(){let old=filter;filter=cond.value;let a=labData();filter=old;return a}function analyze(){let a=condData(),m=metric.value,s=stat.value;if(s==='count'){res.textContent=`결과: ${a.length}행`;return}let vs=a.map(r=>Number(r[m])).filter(Number.isFinite),v=s==='avg'?vs.reduce((x,y)=>x+y,0)/vs.length:s==='max'?Math.max(...vs):Math.min(...vs);res.textContent=`결과: ${Math.round(v*10)/10}`}
function answers(){if(current==='meal'){let min=Math.min(...MEAL.map(r=>r.leftover)),m=MEAL.find(r=>r.leftover===min).menu,hi=MEAL.filter(r=>r.satisfaction>=4),avg=hi.reduce((s,r)=>s+r.leftover,0)/hi.length;return{m1:m,m2:avg,m3:0}}return{s1:SCHOOLS.reduce((a,b)=>a.students>b.students?a:b).school,s2:15,s3:5}}function check(){let a=practice[current]?.answers||{},keys=answers();DEF[current].fields.forEach(f=>{let [id,,type]=f,fb=document.getElementById('fb_'+id),v=a[id];if(id in keys){let ok=type==='number'?Math.abs(Number(v)-Number(keys[id]))<.6:type==='choice'?Number(v)===Number(keys[id]):String(v||'').trim()===String(keys[id]);fb.textContent=!String(v??'').trim()?'답을 입력하세요.':ok?'✓ 맞았습니다.':'다시 데이터를 확인하세요.';fb.className='feedback '+(ok?'ok':'no')}else{let ok=String(v||'').trim().length>0;fb.textContent=ok?'✓ 작성했습니다.':'내용을 작성하세요.';fb.className='feedback '+(ok?'ok':'no')}})}function complete(){let a=practice[current]?.answers||{},miss=DEF[current].fields.filter(f=>a[f[0]]===undefined||String(a[f[0]]).trim()==='');if(miss.length){alert('아직 작성하지 않은 문제가 있습니다.');check();return}practice[current].completed=true;saveP();alert('혼자 연습을 완료했습니다.');showHome()}
function summaryText(){let x=[`학생: ${profile.studentClass||''} ${profile.studentNo||''}번 ${profile.studentName||''}`,`공통 수업 완료 차시: ${(commonDone||[]).join(', ')||'없음'}`,'','[공통 수업 웹앱 답안]'];Object.keys(commonAnswers).sort().forEach(k=>x.push(`${k}: ${commonAnswers[k]}`));Object.entries(DEF).forEach(([k,d])=>{x.push('',`[혼자 연습] ${d.title}`);let a=practice[k]?.answers||{};d.fields.forEach(f=>{let v=a[f[0]]??'';if(f[2]==='choice'&&v!=='')v=f[3][Number(v)];x.push(`${f[1]}: ${v}`)})});return x.join('\n')}function showSubmit(){showOnly('submit');let pd=Object.values(practice).filter(x=>x?.completed).length;status.innerHTML=`공통 수업 완료 <strong>${commonDone.length}/8</strong> · 혼자 연습 완료 <strong>${pd}/2</strong> · ${API?'교사 서버 연결됨':'교사 서버 미연결'}`;summary.textContent=summaryText()}async function directSubmit(){if(!profile.studentName||!profile.studentClass||!profile.studentNo){alert('학생 정보를 먼저 저장하세요.');return}if(!API){alert('교사 제출 서버가 연결되지 않았습니다. 선생님이 제공한 전용 링크를 사용하거나 CSV를 내려받으세요.');return}let payload={token:TOKEN,profile,done:commonDone,answers:commonAnswers,practice,submittedAt:new Date().toISOString(),clientVersion:'practice-v2'};try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});alert('제출 요청을 보냈습니다.')}catch(e){alert('제출에 실패했습니다. CSV 백업을 사용하세요.')}}function q(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function downloadCSV(){let rows=[['반','번호','이름','구분','차시/연습','활동','답안']];rows.push([profile.studentClass,profile.studentNo,profile.studentName,'메타','완료차시',commonDone.length,commonDone.join('|')]);Object.keys(commonAnswers).sort().forEach(k=>rows.push([profile.studentClass,profile.studentNo,profile.studentName,'공통수업','',k,commonAnswers[k]]));Object.entries(DEF).forEach(([k,d])=>{let a=practice[k]?.answers||{};d.fields.forEach(f=>{let v=a[f[0]]??'';if(f[2]==='choice'&&v!=='')v=f[3][Number(v)];rows.push([profile.studentClass,profile.studentNo,profile.studentName,'혼자연습',d.title,f[1],v])})});let txt='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),b=new Blob([txt],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`데이터수업_통합_${profile.studentClass}_${profile.studentNo}_${profile.studentName}.csv`;a.click()}loadProfile();
