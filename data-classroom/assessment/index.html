<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정보 수행평가 데이터 실험실</title><style>:root{--b:#2563eb;--line:#dbe2ea;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:var(--bg);color:#1f2937}.wrap{max-width:1180px;margin:auto;padding:24px 14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}.login{max-width:520px;margin:6vh auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ds{border:1px solid var(--line);border-radius:14px;padding:16px}.locked{opacity:.55}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:800}.btn{padding:10px 13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff;border:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field select,.field input{width:100%}select,input{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.notice{padding:11px;border-radius:9px;background:#fff8e7;border-left:4px solid #f59e0b}.condition{display:grid;grid-template-columns:1.3fr .7fr 1.1fr auto;gap:7px;margin:7px 0}.sortbox,.chartcontrols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.tbl{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}.tbl th,.tbl td{padding:7px;border-bottom:1px solid #edf0f3;text-align:center}.tbl th{background:#f3f4f6}.result{font-weight:800;color:#1f4e78;margin:9px 0}.chartbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto}.chartbox svg{display:block;width:100%;min-width:650px;height:430px}.tip{background:#eff6ff;border-radius:10px;padding:10px;margin:10px 0}@media(max-width:760px){.grid,.condition,.sortbox,.chartcontrols{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="card login"><span class="badge">중학교 정보 · 데이터 수행평가</span><h1>데이터 분석 실험실</h1><div class="field"><label>학급</label><select id="cls"><option value="">선택</option><option>1반</option><option>2반</option></select></div><div class="field"><label>번호</label><select id="no"><option value="">선택</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option></select></div><div class="field"><label>이름</label><input id="studentName" maxlength="10"></div><button class="btn primary" style="width:100%" onclick="enter()">입장하기</button></section><section id="home" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><span class="badge">데이터 수행평가</span><h1>데이터 분석 실험실</h1></div><b id="who"></b></div></div><div class="grid"><div class="ds"><h2>연습 1 · 영화관</h2><p>집단 비교·관계·시간에 따른 변화를 연습합니다.</p><button class="btn primary" onclick="openSet(1)">연습 시작</button></div><div class="ds"><h2>연습 2 · 스포츠</h2><p>종목 비교·관계·경기별 변화를 연습합니다.</p><button class="btn primary" onclick="openSet(2)">연습 시작</button></div><div class="ds"><h2>수행평가 · 여행지 관광</h2><p>유형 비교·거리와 방문객 관계·월별 변화를 분석합니다.</p><button class="btn primary" onclick="openSet(3)">수행평가 연습 화면</button></div></div></section><section id="lab" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><h1 id="labTitle"></h1><button class="btn" onclick="showHome()">← 목록</button></div><p id="task" class="notice"></p><div class="panel"><b>① 조건 필터</b><div id="conditions"></div><div class="row"><button class="btn" onclick="addCondition()">＋ 조건 추가</button><button class="btn" onclick="clearConditions()">전체 삭제</button></div></div><div class="panel"><b>② 정렬</b><div class="sortbox"><select id="sortKey"></select><select id="sortDir"><option value="asc">오름차순</option><option value="desc">내림차순</option></select><button class="btn primary" onclick="draw()">적용</button></div></div><div id="result" class="result"></div><div class="tablewrap"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="row" style="margin-top:10px"><select id="metric"></select><select id="stat"><option value="avg">평균</option><option value="max">최댓값</option><option value="min">최솟값</option><option value="count">개수</option></select><button class="btn primary" onclick="calc()">계산</button></div><div id="calcResult" class="result"></div><div class="panel" style="margin-top:16px"><b>③ 그래프 시뮬레이션</b><div class="tip"><b>막대그래프</b> = 집단이나 항목의 크기 비교　/　<b>산점도</b> = 두 수치 데이터의 관계　/　<b>꺾은선형 그래프</b> = 시간에 따른 변화</div><div class="chartcontrols"><select id="chartType"><option value="bar">막대그래프 · 비교</option><option value="scatter">산점도 · 관계</option><option value="line">꺾은선형 그래프 · 변화</option></select><select id="xKey"></select><select id="yKey"></select></div><button class="btn primary" style="margin-top:8px" onclick="makeChart()">그래프 만들기</button><div id="chartHelp" class="result"></div><div class="chartbox"><svg id="chart" viewBox="0 0 760 430"></svg></div></div></div></section></main><script>const $=id=>document.getElementById(id);let profile=null,current=1,conds=[];function gen(seed,n,k){let s=seed>>>0,r=()=>((s=(s*1664525+1013904223)>>>0)/4294967296),a=[];for(let i=1;i<=n;i++){if(k===1){let genre=['애니메이션','액션','코미디','드라마'][Math.floor(r()*4)],audience=40+Math.floor(r()*111);a.push({id:'M'+String(i).padStart(2,'0'),month:(i-1)%12+1,genre,audience,price:[9000,10000,11000,12000][Math.floor(r()*4)],rating:1+Math.floor(r()*5)})}else if(k===2){let shots=5+Math.floor(r()*26);a.push({id:'G'+String(i).padStart(2,'0'),round:i,sport:['농구','축구','배구','풋살'][Math.floor(r()*4)],shots,score:Math.min(9,Math.floor(shots/5+r()*3)),crowd:100+Math.floor(r()*1401)})}else{let month=(i-1)%12+1,distance=5+Math.floor(r()*196),season=month<=2||month===12?650:month>=6&&month<=8?1100:850,visitors=Math.max(200,Math.round(800+season+r()*1900-distance*4));a.push({id:'T'+String(i).padStart(2,'0'),month,region:['동부','서부','남부','북부'][Math.floor(r()*4)],type:['자연','문화','체험','휴양'][Math.floor(r()*4)],visitors,stay:Math.round((.5+r()*4)*10)/10,fee:[0,3000,5000,8000,10000,15000][Math.floor(r()*6)],rating:1+Math.floor(r()*5),distance})}}return a}const SETS={1:{title:'연습 1 · 영화관 이용 데이터',data:gen(101,60,1),task:'막대그래프로 영화 장르별 관람객을 비교하고, 산점도로 티켓 가격과 관람객 수의 관계를 살펴보고, 꺾은선형 그래프로 월별 관람객 변화를 확인하세요.'},2:{title:'연습 2 · 스포츠 경기 데이터',data:gen(202,60,2),task:'막대그래프로 종목별 득점을 비교하고, 산점도로 슈팅 수와 득점의 관계를 살펴보고, 꺾은선형 그래프로 경기 순서에 따른 관중 수 변화를 확인하세요.'},3:{title:'수행평가 · 여행지 관광 데이터',data:gen(303,60,3),task:'막대그래프는 관광지 유형별 방문객 비교, 산점도는 이동거리와 방문객 수의 관계, 꺾은선형 그래프는 월별 방문객 수 변화를 확인하는 데 사용하세요.'}};const N={id:'자료번호',month:'월',round:'경기 순서',genre:'영화 장르',audience:'관람객 수(명)',price:'티켓 가격(원)',rating:'만족도(1~5)',sport:'종목',shots:'슈팅 수(회)',score:'득점',crowd:'관중 수(명)',region:'지역',type:'관광지 유형',visitors:'방문객 수(명)',stay:'평균 체류시간(시간)',fee:'입장료(원)',distance:'이동거리(km)'};function hs(){return Object.keys(SETS[current].data[0]).map(k=>[k,N[k]||k])}function enter(){let c=$('cls').value,n=$('no').value,nm=$('studentName').value.trim();if(!c||!n||nm.length<2)return alert('학급, 번호, 이름을 정확히 입력하세요.');profile={c,n,nm};$('login').classList.add('hidden');$('home').classList.remove('hidden');$('who').textContent=`${c} ${n}번 ${nm}`}function showHome(){$('lab').classList.add('hidden');$('home').classList.remove('hidden')}function openSet(n){current=n;conds=[];$('home').classList.add('hidden');$('lab').classList.remove('hidden');$('labTitle').textContent=SETS[n].title;$('task').textContent=SETS[n].task;setup()}function setup(){let h=hs(),opts=h.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join(''),nums=h.filter(x=>typeof SETS[current].data[0][x[0]]==='number').map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('sortKey').innerHTML='<option value="">정렬하지 않음</option>'+opts;$('metric').innerHTML=nums;$('xKey').innerHTML=opts;$('yKey').innerHTML=nums;addCondition();setChartDefaults();draw()}function setChartDefaults(){let t=$('chartType').value;if(current===3){$('xKey').value=t==='bar'?'type':t==='scatter'?'distance':'month';$('yKey').value='visitors'}else if(current===2){$('xKey').value=t==='bar'?'sport':t==='scatter'?'shots':'round';$('yKey').value=t==='line'?'crowd':'score'}else{$('xKey').value=t==='bar'?'genre':t==='scatter'?'price':'month';$('yKey').value='audience'}}function addCondition(){conds.push({key:hs()[0][0],op:'eq',value:''});renderConditions()}function clearConditions(){conds=[];renderConditions();draw()}function removeCondition(i){conds.splice(i,1);renderConditions();draw()}function renderConditions(){$('conditions').innerHTML=conds.map((c,i)=>`<div class="condition"><select onchange="setCond(${i},'key',this.value)">${hs().map(h=>`<option value="${h[0]}" ${c.key===h[0]?'selected':''}>${h[1]}</option>`).join('')}</select><select onchange="setCond(${i},'op',this.value)"><option value="eq">=</option><option value="ne">≠</option><option value="gt">&gt;</option><option value="ge">≥</option><option value="lt">&lt;</option><option value="le">≤</option></select><input value="${c.value}" oninput="setCond(${i},'value',this.value)" placeholder="조건값"><button class="btn" onclick="removeCondition(${i})">삭제</button></div>`).join('')}function setCond(i,k,v){conds[i][k]=v;draw()}function match(r,c){if(c.value==='')return true;let a=r[c.key],b=typeof a==='number'?Number(c.value):c.value;return c.op==='eq'?String(a)===String(b):c.op==='ne'?String(a)!==String(b):c.op==='gt'?a>b:c.op==='ge'?a>=b:c.op==='lt'?a<b:a<=b}function filtered(){let a=SETS[current].data.filter(r=>conds.every(c=>match(r,c))),k=$('sortKey').value,d=$('sortDir').value==='asc'?1:-1;if(k)a.sort((x,y)=>(typeof x[k]==='number'?x[k]-y[k]:String(x[k]).localeCompare(String(y[k]),'ko'))*d);return a}function draw(){let h=hs(),a=filtered();$('thead').innerHTML='<tr>'+h.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';$('tbody').innerHTML=a.map(r=>'<tr>'+h.map(x=>`<td>${r[x[0]]}</td>`).join('')+'</tr>').join('');$('result').textContent=`전체 ${SETS[current].data.length}개 중 조건 만족: ${a.length}개`;makeChart()}function calc(){let a=filtered(),k=$('metric').value,s=$('stat').value;if(s==='count')return $('calcResult').textContent=`계산 결과: ${a.length}개`;let v=a.map(r=>+r[k]).filter(Number.isFinite);if(!v.length)return;let z=s==='avg'?v.reduce((p,c)=>p+c,0)/v.length:s==='max'?Math.max(...v):Math.min(...v);$('calcResult').textContent=`계산 결과: ${Math.round(z*10)/10}`}function aggregate(a,x,y,type){if(type==='scatter')return a;let m=new Map;a.forEach(r=>{if(!m.has(r[x]))m.set(r[x],[]);m.get(r[x]).push(+r[y])});let z=[...m].map(([x,v])=>({x,y:v.reduce((p,c)=>p+c,0)/v.length}));if(type==='line')z.sort((a,b)=>Number(a.x)-Number(b.x));return z}function makeChart(){let type=$('chartType').value,x=$('xKey').value,y=$('yKey').value,raw=filtered(),a=aggregate(raw,x,y,type),svg=$('chart');if(!a.length){svg.innerHTML='';return}if(type==='scatter'&&typeof raw[0][x]!=='number'){$('chartHelp').textContent='산점도는 X축과 Y축 모두 숫자 데이터를 선택하세요.';svg.innerHTML='';return}let vals=a.map(r=>type==='scatter'?+r[y]:+r.y),W=760,H=430,L=70,R=25,T=30,B=70,pw=W-L-R,ph=H-T-B,ymax=Math.max(...vals,1),p=[`<rect width="760" height="430" fill="white"/>`,`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#334155"/>`,`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#334155"/>`,`<text x="${L}" y="18" font-size="14">${N[y]}</text>`,`<text x="${W/2}" y="420" text-anchor="middle" font-size="14">${N[x]}</text>`];if(type==='scatter'){let xs=a.map(r=>+r[x]),xmin=Math.min(...xs),xmax=Math.max(...xs);if(xmax===xmin)xmax++;a.forEach(r=>{let cx=L+(r[x]-xmin)/(xmax-xmin)*pw,cy=T+ph-r[y]/ymax*ph;p.push(`<circle cx="${cx}" cy="${cy}" r="5" fill="#2563eb"/>`)});$('chartHelp').textContent=`산점도: ${N[x]}와 ${N[y]}의 관계`}else{let gap=pw/a.length;if(type==='bar'){a.forEach((r,i)=>{let bh=r.y/ymax*ph,bw=Math.max(14,gap*.55),xx=L+i*gap+(gap-bw)/2;p.push(`<rect x="${xx}" y="${H-B-bh}" width="${bw}" height="${bh}" fill="#2563eb"/><text x="${xx+bw/2}" y="${H-B+18}" text-anchor="middle" font-size="11">${r.x}</text>`)});$('chartHelp').textContent=`막대그래프: ${N[x]}별 ${N[y]} 평균 비교`}else{let pts=a.map((r,i)=>`${L+gap*(i+.5)},${T+ph-r.y/ymax*ph}`).join(' ');p.push(`<polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="3"/>`);a.forEach((r,i)=>p.push(`<circle cx="${L+gap*(i+.5)}" cy="${T+ph-r.y/ymax*ph}" r="4" fill="#2563eb"/><text x="${L+gap*(i+.5)}" y="${H-B+18}" text-anchor="middle" font-size="11">${r.x}</text>`));$('chartHelp').textContent=`꺾은선형 그래프: ${N[x]}에 따른 ${N[y]} 변화`}}svg.innerHTML=p.join('')}$('chartType').onchange=()=>{setChartDefaults();makeChart()};$('xKey').onchange=makeChart;$('yKey').onchange=makeChart;$('sortKey').onchange=draw;$('sortDir').onchange=draw;</script></body></html>
