<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정보 수행평가 데이터 실험실</title><style>:root{--b:#2563eb;--g:#15803d;--r:#b91c1c;--line:#dbe2ea;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:var(--bg);color:#1f2937}.wrap{max-width:1180px;margin:auto;padding:24px 14px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}.login{max-width:520px;margin:6vh auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ds,.panel{border:1px solid var(--line);border-radius:14px;padding:16px}.locked{opacity:.55}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800}.btn{padding:10px 13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff;border:0}.green{background:var(--g);color:#fff;border:0}.red{background:var(--r);color:#fff;border:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field select,.field input{width:100%}select,input{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.notice{padding:11px;border-radius:9px;background:#fff8e7;border-left:4px solid #f59e0b}.condition{display:grid;grid-template-columns:1.3fr .7fr 1.1fr auto;gap:7px;margin:7px 0}.sortbox,.chartcontrols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.tbl{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}.tbl th,.tbl td{padding:7px;border-bottom:1px solid #edf0f3;text-align:center}.tbl th{background:#f3f4f6}.result{font-weight:800;color:#1f4e78;margin:9px 0}.chartbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;overflow:auto}.chartbox svg{display:block;width:100%;min-width:650px;height:430px}.examwarn{position:fixed;inset:0;background:rgba(15,23,42,.88);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}.examwarn>div{max-width:520px;background:#fff;border-radius:16px;padding:26px;text-align:center}.danger{color:var(--r);font-weight:900}@media(max-width:760px){.grid,.condition,.sortbox,.chartcontrols{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="card login"><span class="badge">중학교 정보 · 데이터 수행평가</span><h1>데이터 분석 실험실</h1><div class="field"><label>학급</label><select id="cls"><option value="">선택</option><option>1반</option><option>2반</option></select></div><div class="field"><label>번호</label><select id="no"><option value="">선택</option></select></div><div class="field"><label>이름</label><input id="studentName" maxlength="10"></div><button class="btn primary" style="width:100%" onclick="enter()">입장하기</button><div class="row" style="justify-content:center;margin-top:15px"><button class="btn" onclick="teacherLogin()">교사 관리</button></div></section><section id="home" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><span class="badge">데이터 수행평가</span><h1>데이터 분석 실험실</h1></div><b id="who"></b></div></div><div class="grid"><div class="ds"><span class="badge">연습 1</span><h2>영화관 이용 데이터</h2><button class="btn primary" onclick="openSet(1)">연습 시작</button></div><div class="ds"><span class="badge">연습 2</span><h2>스포츠 경기 데이터</h2><button class="btn primary" onclick="openSet(2)">연습 시작</button></div><div id="examCard" class="ds locked"><span class="badge">수행평가</span><h2>여행지 관광 데이터</h2><p id="examMsg">교사가 열면 입장할 수 있습니다.</p><button id="examBtn" class="btn" disabled onclick="openSet(3)">🔒 잠겨 있음</button></div></div></section><section id="lab" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><span id="labBadge" class="badge"></span><h1 id="labTitle"></h1></div><button id="backBtn" class="btn" onclick="showHome()">← 목록</button></div><div id="examState" class="hidden notice"><b>수행평가 집중 모드</b> · 전체화면을 유지하세요. 화면 이탈 <b id="leaveCount">0</b>회</div><p id="task" class="notice"></p><div class="panel"><b>① 조건 필터</b><div id="conditions"></div><div class="row"><button class="btn" onclick="addCondition()">＋ 조건 추가</button><button class="btn" onclick="clearConditions()">전체 삭제</button></div></div><div class="panel" style="margin-top:12px"><b>② 정렬</b><div class="sortbox" style="margin-top:8px"><select id="sortKey"></select><select id="sortDir"><option value="asc">오름차순</option><option value="desc">내림차순</option></select><button class="btn primary" onclick="draw()">적용</button></div></div><div id="result" class="result"></div><div class="tablewrap"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="row" style="margin-top:10px"><select id="metric"></select><select id="stat"><option value="avg">평균</option><option value="max">최댓값</option><option value="min">최솟값</option><option value="count">개수</option></select><button class="btn primary" onclick="calc()">계산</button></div><div id="calcResult" class="result"></div><div class="panel" style="margin-top:16px"><b>③ 그래프 시뮬레이션</b><p>현재 필터·정렬된 데이터를 이용해 그래프를 만들어 수행평가지에 옮겨 그릴 수 있습니다.</p><div class="chartcontrols"><select id="chartType"><option value="bar">막대그래프</option><option value="line">꺾은선형 그래프</option><option value="scatter">산점도</option></select><select id="xKey"></select><select id="yKey"></select></div><div class="row" style="margin-top:8px"><button class="btn primary" onclick="makeChart()">그래프 만들기</button><label>표시 자료 수 <select id="chartN"><option>3</option><option>5</option><option>10</option><option selected>20</option><option>60</option></select></label></div><div id="chartHelp" class="result"></div><div class="chartbox"><svg id="chart" viewBox="0 0 760 430" aria-label="데이터 그래프"></svg></div></div></div></section><section id="teacher" class="hidden"><div class="card"><h1>교사 관리</h1><div class="field"><label>교사용 키</label><input id="tkey" type="password"></div><div class="row"><button class="btn green" onclick="controlExam(true)">수행평가 열기</button><button class="btn red" onclick="controlExam(false)">수행평가 닫기</button><button class="btn" onclick="teacherStatus()">상태 확인</button><button class="btn" onclick="location.href='teacher-monitor.html?api='+encodeURIComponent(API)">실시간 감독 화면</button></div><div id="tstatus" class="result"></div></div></section></main><div id="focusWarn" class="examwarn hidden"><div><h2>⚠️ 화면 이탈 감지</h2><p>다른 화면으로 이동하거나 전체화면을 종료했습니다.</p><p class="danger">누적 <span id="warnCount">0</span>회</p><button class="btn primary" onclick="resumeExam()">평가 화면으로 돌아가기</button></div></div><script>const $=id=>document.getElementById(id),API=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbyf3z7_SX2YstcI3Fk4frCltumbqPEh__Ebwk6RvYOVDVNv3QqwNUx5ceZbw9F8CtsY/exec',TOKEN=new URLSearchParams(location.search).get('token')||'data-2026-student';for(let i=1;i<=20;i++)$('no').insertAdjacentHTML('beforeend',`<option>${i}</option>`);let profile=null,current=1,conds=[],examActive=false,leaves=0,lastLeave=0;function gen(seed,n,k){let s=seed>>>0,r=()=>((s=(s*1664525+1013904223)>>>0)/4294967296),a=[];for(let i=1;i<=n;i++){if(k===1){let g=['애니메이션','액션','코미디','드라마'][Math.floor(r()*4)],cap=[80,100,120,150][Math.floor(r()*4)],aud=35+Math.floor(r()*(cap-34));a.push({id:'M'+String(i).padStart(2,'0'),genre:g,showtime:['10시','13시','16시','19시'][Math.floor(r()*4)],audience:aud,occupancy:Math.round(aud/cap*100),price:[9000,10000,11000,12000][Math.floor(r()*4)],rating:1+Math.floor(r()*5)})}else if(k===2){a.push({id:'G'+String(i).padStart(2,'0'),sport:['농구','축구','배구','풋살'][Math.floor(r()*4)],score:Math.floor(r()*8),opponent:Math.floor(r()*8),shots:5+Math.floor(r()*26),minutes:[40,60,80,90][Math.floor(r()*4)],crowd:100+Math.floor(r()*1401)})}else{a.push({id:'T'+String(i).padStart(2,'0'),region:['동부','서부','남부','북부'][Math.floor(r()*4)],type:['자연','문화','체험','휴양'][Math.floor(r()*4)],visitors:200+Math.floor(r()*4801),stay:Math.round((.5+r()*4)*10)/10,fee:[0,3000,5000,8000,10000,15000][Math.floor(r()*6)],rating:1+Math.floor(r()*5),distance:5+Math.floor(r()*196)})}}return a}const SETS={1:{title:'연습문제 1 · 영화관 이용 데이터',data:gen(101,60,1),task:'조건 필터, 정렬, 계산과 세 가지 그래프를 자유롭게 연습하세요.'},2:{title:'연습문제 2 · 스포츠 경기 데이터',data:gen(202,60,2),task:'조건을 조합한 뒤 막대·꺾은선·산점도를 바꾸어 비교해 보세요.'},3:{title:'수행평가 · 여행지 관광 데이터',data:gen(303,60,3),task:'수행평가지를 읽고 필요한 조건·정렬·계산·그래프를 직접 선택하세요.'}};const N={id:'자료번호',genre:'영화 장르',showtime:'상영시간',audience:'관람객 수(명)',occupancy:'좌석 점유율(%)',price:'티켓 가격(원)',rating:'만족도(1~5)',sport:'종목',score:'득점',opponent:'실점',shots:'슈팅 수(회)',minutes:'경기시간(분)',crowd:'관중 수(명)',region:'지역',type:'관광지 유형',visitors:'방문객 수(명)',stay:'평균 체류시간(시간)',fee:'입장료(원)',distance:'이동거리(km)'};function hs(){return Object.keys(SETS[current].data[0]).map(k=>[k,N[k]||k])}function enter(){let c=$('cls').value,n=+$('no').value,nm=$('studentName').value.trim();if(!c||!n||nm.length<2)return alert('학급, 번호, 이름을 정확히 입력하세요.');profile={studentClass:c,studentNo:n,studentName:nm};$('login').classList.add('hidden');$('home').classList.remove('hidden');$('who').textContent=`${c} ${n}번 ${nm}`;checkExam()}function teacherLogin(){$('login').classList.add('hidden');$('teacher').classList.remove('hidden')}function showHome(){if(examActive)return alert('수행평가 중에는 나갈 수 없습니다.');$('lab').classList.add('hidden');$('home').classList.remove('hidden')}function jsonp(p){return new Promise((ok,bad)=>{let cb='c'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script'),u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);let t=setTimeout(()=>{delete window[cb];s.remove();bad()},6000);window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();ok(d)};s.onerror=bad;s.src=u;document.body.appendChild(s)})}async function checkExam(){try{let d=await jsonp({action:'assessmentStatus',token:TOKEN});setExam(!!d.open)}catch(e){setExam(false)}}function setExam(o){$('examCard').classList.toggle('locked',!o);$('examBtn').disabled=!o;$('examBtn').textContent=o?'수행평가 입장':'🔒 잠겨 있음';$('examMsg').textContent=o?'지금 수행평가가 열려 있습니다.':'교사가 열면 입장할 수 있습니다.'}async function controlExam(o){let k=$('tkey').value.trim();if(!k)return alert('교사용 키를 입력하세요.');try{let d=await jsonp({action:'assessmentControl',key:k,open:o?'1':'0'});$('tstatus').textContent=d.ok?`수행평가 ${o?'열림':'닫힘'}`:'키를 확인하세요.'}catch(e){$('tstatus').textContent='서버 연결을 확인하세요.'}}async function teacherStatus(){let k=$('tkey').value.trim();try{let d=await jsonp({action:'assessmentStatus',key:k});$('tstatus').textContent=d.ok===false?'키를 확인하세요.':`현재 ${d.open?'열림':'닫힘'}`}catch(e){$('tstatus').textContent='서버 연결을 확인하세요.'}}async function eventSend(ev,detail=''){if(!profile)return;try{await jsonp({action:'assessmentEvent',token:TOKEN,studentClass:profile.studentClass,studentNo:profile.studentNo,studentName:profile.studentName,event:ev,count:leaves,detail})}catch(e){}}async function openSet(n){if(n===3&&$('examBtn').disabled)return;current=n;conds=[];$('home').classList.add('hidden');$('lab').classList.remove('hidden');$('labBadge').textContent=n===3?'수행평가':'연습';$('labTitle').textContent=SETS[n].title;$('task').textContent=SETS[n].task;$('examState').classList.toggle('hidden',n!==3);$('backBtn').classList.toggle('hidden',n===3);setup();if(n===3){examActive=true;leaves=0;eventSend('start');try{await document.documentElement.requestFullscreen()}catch(e){}}}function setup(){let h=hs(),opts=h.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join(''),nums=h.filter(x=>typeof SETS[current].data[0][x[0]]==='number').map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('sortKey').innerHTML='<option value="">정렬하지 않음</option>'+opts;$('metric').innerHTML=nums;$('xKey').innerHTML=opts;$('yKey').innerHTML=nums;let keys=h.map(x=>x[0]);$('xKey').value=keys.includes('id')?'id':keys[0];$('yKey').value=keys.includes('visitors')?'visitors':h.find(x=>typeof SETS[current].data[0][x[0]]==='number')[0];addCondition();draw();makeChart()}function addCondition(){conds.push({key:hs()[0][0],op:'eq',value:''});renderConditions()}function clearConditions(){conds=[];renderConditions();draw()}function removeCondition(i){conds.splice(i,1);renderConditions();draw()}function renderConditions(){$('conditions').innerHTML=conds.map((c,i)=>`<div class="condition"><select onchange="setCond(${i},'key',this.value)">${hs().map(h=>`<option value="${h[0]}" ${c.key===h[0]?'selected':''}>${h[1]}</option>`).join('')}</select><select onchange="setCond(${i},'op',this.value)"><option value="eq">=</option><option value="ne">≠</option><option value="gt">&gt;</option><option value="ge">≥</option><option value="lt">&lt;</option><option value="le">≤</option></select><input value="${c.value}" oninput="setCond(${i},'value',this.value)" placeholder="조건값"><button class="btn" onclick="removeCondition(${i})">삭제</button></div>`).join('')}function setCond(i,k,v){conds[i][k]=v;draw()}function match(r,c){if(c.value==='')return true;let a=r[c.key],b=typeof a==='number'?Number(c.value):c.value;if(c.op==='eq')return String(a)===String(b);if(c.op==='ne')return String(a)!==String(b);if(c.op==='gt')return a>b;if(c.op==='ge')return a>=b;if(c.op==='lt')return a<b;if(c.op==='le')return a<=b;return true}function filtered(){let a=SETS[current].data.filter(r=>conds.every(c=>match(r,c))),k=$('sortKey').value,d=$('sortDir').value==='asc'?1:-1;if(k)a.sort((x,y)=>(typeof x[k]==='number'?x[k]-y[k]:String(x[k]).localeCompare(String(y[k]),'ko'))*d);return a}function draw(){let h=hs(),a=filtered();$('thead').innerHTML='<tr>'+h.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';$('tbody').innerHTML=a.map(r=>'<tr>'+h.map(x=>`<td>${r[x[0]]}</td>`).join('')+'</tr>').join('');$('result').textContent=`전체 ${SETS[current].data.length}개 중 조건 만족: ${a.length}개`;makeChart()}$('sortKey').onchange=draw;$('sortDir').onchange=draw;function calc(){let a=filtered(),k=$('metric').value,s=$('stat').value;if(s==='count')return $('calcResult').textContent=`계산 결과: ${a.length}개`;let v=a.map(r=>+r[k]).filter(Number.isFinite);if(!v.length)return $('calcResult').textContent='계산할 데이터가 없습니다.';let x=s==='avg'?v.reduce((p,c)=>p+c,0)/v.length:s==='max'?Math.max(...v):Math.min(...v);$('calcResult').textContent=`계산 결과: ${Math.round(x*10)/10}`}function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function makeChart(){let type=$('chartType').value,x=$('xKey').value,y=$('yKey').value,n=+$('chartN').value,a=filtered().slice(0,n),svg=$('chart');if(!a.length){svg.innerHTML='';$('chartHelp').textContent='표시할 데이터가 없습니다.';return}if(type==='scatter'&&typeof a[0][x]!=='number'){$('chartHelp').textContent='산점도는 X축과 Y축 모두 숫자 항목을 선택해야 합니다.';svg.innerHTML='';return}let W=760,H=430,L=72,R=24,T=28,B=70,pw=W-L-R,ph=H-T-B,ys=a.map(r=>+r[y]).filter(Number.isFinite),ymax=Math.max(...ys,1),ymin=0,parts=[`<rect x="0" y="0" width="760" height="430" fill="white"/>`,`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#334155"/>`,`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#334155"/>`,`<text x="${L}" y="18" font-size="14" font-weight="700">${esc(N[y]||y)}</text>`,`<text x="${W/2}" y="420" text-anchor="middle" font-size="14" font-weight="700">${esc(N[x]||x)}</text>`];for(let i=0;i<=4;i++){let yy=T+ph*i/4,val=Math.round(ymax*(4-i)/4);parts.push(`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e5e7eb"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11">${val}</text>`)}if(type==='scatter'){let xs=a.map(r=>+r[x]),xmin=Math.min(...xs),xmax=Math.max(...xs);if(xmax===xmin)xmax=xmin+1;a.forEach(r=>{let cx=L+(r[x]-xmin)/(xmax-xmin)*pw,cy=T+ph-(r[y]-ymin)/(ymax-ymin)*ph;parts.push(`<circle cx="${cx}" cy="${cy}" r="5" fill="#2563eb"><title>${esc(r.id)}: ${r[x]}, ${r[y]}</title></circle>`)});for(let i=0;i<=4;i++){let xx=L+pw*i/4,val=Math.round((xmin+(xmax-xmin)*i/4)*10)/10;parts.push(`<text x="${xx}" y="${H-B+20}" text-anchor="middle" font-size="11">${val}</text>`)}}else{let gap=pw/a.length;if(type==='bar')a.forEach((r,i)=>{let bh=(r[y]/ymax)*ph,bw=Math.max(5,gap*.62),xx=L+i*gap+(gap-bw)/2,yy=H-B-bh;parts.push(`<rect x="${xx}" y="${yy}" width="${bw}" height="${bh}" fill="#2563eb"><title>${esc(r[x])}: ${r[y]}</title></rect>`);if(a.length<=20)parts.push(`<text x="${xx+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="10">${esc(r[x])}</text>`)}) ;else{let pts=a.map((r,i)=>`${L+gap*(i+.5)},${T+ph-(r[y]/ymax)*ph}`).join(' ');parts.push(`<polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="3"/>`);a.forEach((r,i)=>{let xx=L+gap*(i+.5),yy=T+ph-(r[y]/ymax)*ph;parts.push(`<circle cx="${xx}" cy="${yy}" r="4" fill="#2563eb"/>`);if(a.length<=20)parts.push(`<text x="${xx}" y="${H-B+16}" text-anchor="middle" font-size="10">${esc(r[x])}</text>`)})}}svg.innerHTML=parts.join('');$('chartHelp').textContent=`${type==='bar'?'막대그래프':type==='line'?'꺾은선형 그래프':'산점도'} · X축: ${N[x]||x} · Y축: ${N[y]||y} · ${a.length}개 자료 표시`}$('chartType').onchange=makeChart;$('xKey').onchange=makeChart;$('yKey').onchange=makeChart;$('chartN').onchange=makeChart;function warn(detail){if(!examActive)return;let now=Date.now();if(now-lastLeave<1200)return;lastLeave=now;leaves++;$('leaveCount').textContent=leaves;$('warnCount').textContent=leaves;$('focusWarn').classList.remove('hidden');eventSend('leave',detail)}async function resumeExam(){$('focusWarn').classList.add('hidden');eventSend('return');try{await document.documentElement.requestFullscreen()}catch(e){}}document.addEventListener('visibilitychange',()=>{if(examActive&&document.hidden)warn('탭 또는 화면 전환')});document.addEventListener('fullscreenchange',()=>{if(examActive&&!document.fullscreenElement)warn('전체화면 종료')});window.addEventListener('blur',()=>{if(examActive)warn('브라우저 포커스 이탈')});window.addEventListener('beforeunload',e=>{if(examActive){e.preventDefault();e.returnValue=''}});</script></body></html>
