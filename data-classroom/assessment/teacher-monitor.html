<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수행평가 실시간 감독</title><style>body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:10px 13px;border:1px solid #cbd5e1;border-radius:10px}button{font-weight:800;cursor:pointer}.primary{background:#2563eb;color:white;border:0}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{padding:16px;border-radius:14px;background:#f8fafc}.num{font-size:28px;font-weight:900}.alert{border-left:5px solid #dc2626;background:#fff1f2;padding:13px;margin:8px 0;border-radius:10px}.ok{border-left-color:#16a34a;background:#f0fdf4}.muted{color:#64748b;font-size:13px}@media(max-width:700px){.stat{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>🔴 수행평가 실시간 감독</h1><p>학생의 수행평가 시작·화면 이탈·복귀 기록을 약 3초 간격으로 확인합니다.</p><div class="row"><input id="key" type="password" placeholder="교사용 키"><button class="primary" onclick="start()">감독 시작</button><button onclick="stop()">중지</button></div><p id="state" class="muted"></p></div><div class="card stat"><div class="box"><div>최근 기록 학생</div><div id="students" class="num">0</div></div><div class="box"><div>이탈 기록</div><div id="leaves" class="num">0</div></div><div class="box"><div>마지막 갱신</div><div id="updated" style="font-weight:800">-</div></div></div><div class="card"><h2>최근 감독 기록</h2><div id="events">감독을 시작하세요.</div></div></main><script>const API=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbyf3z7_SX2YstcI3Fk4frCltumbqPEh__Ebwk6RvYOVDVNv3QqwNUx5ceZbw9F8CtsY/exec';let timer=null,lastSig='',audio=null;function jsonp(p){return new Promise((ok,bad)=>{let cb='cb'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script'),u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);let t=setTimeout(()=>{delete window[cb];s.remove();bad(new Error('timeout'))},7000);window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();ok(d)};s.onerror=bad;s.src=u;document.body.appendChild(s)})}function beep(){try{let C=window.AudioContext||window.webkitAudioContext;if(!audio)audio=new C();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(audio.currentTime+.18)}catch(e){}}async function load(){let k=document.getElementById('key').value.trim();if(!k)return;try{let d=await jsonp({action:'assessmentMonitor',key:k});if(!d.ok){document.getElementById('state').textContent='교사용 키를 확인하세요.';return}let ev=d.events||[],students=new Set(ev.map(x=>x.studentClass+'-'+x.studentNo)),leaves=ev.filter(x=>x.event==='leave'),latest=ev[ev.length-1],sig=latest?latest.time+'|'+latest.studentClass+'|'+latest.studentNo+'|'+latest.event:'';if(lastSig&&sig!==lastSig&&latest&&latest.event==='leave')beep();lastSig=sig;document.getElementById('students').textContent=students.size;document.getElementById('leaves').textContent=leaves.length;document.getElementById('updated').textContent=new Date().toLocaleTimeString('ko-KR');document.getElementById('state').textContent='감독 중 · 새 화면 이탈이 감지되면 경고음이 납니다.';document.getElementById('events').innerHTML=ev.slice().reverse().map(x=>`<div class="alert ${x.event==='return'?'ok':''}"><b>${x.studentClass} ${x.studentNo}번 ${x.studentName}</b> · ${label(x.event)} · 누적 ${x.count}회<br><span class="muted">${new Date(x.time).toLocaleString('ko-KR')} ${x.detail||''}</span></div>`).join('')||'아직 기록이 없습니다.'}catch(e){document.getElementById('state').textContent='서버 연결 또는 Apps Script 배포 상태를 확인하세요.'}}function label(e){return {start:'시험 시작',leave:'⚠️ 화면 이탈',return:'화면 복귀',finish:'시험 종료'}[e]||e}function start(){stop();load();timer=setInterval(load,3000)}function stop(){if(timer)clearInterval(timer);timer=null;document.getElementById('state').textContent='감독이 중지되었습니다.'}</script></body></html>
