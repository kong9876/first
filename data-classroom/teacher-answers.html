<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 수업 모범답안</title><style>:root{--bg:#f4f6fa;--card:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--blue:#eaf3ff;--green:#ecfdf3;--yellow:#fff8e7;--navy:#17365d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.65}.wrap{max-width:1080px;margin:auto;padding:24px 16px 70px}.hero,.lesson,.practice{background:#fff;border:1px solid var(--line);border-radius:20px}.hero{padding:26px;background:linear-gradient(135deg,#eaf3ff,#fff 60%,#ecfdf5)}h1,h2,h3{letter-spacing:-.035em;color:var(--navy)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:900}.btn{display:inline-flex;padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:#fff;color:#344054;text-decoration:none;font-weight:900;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.note{background:var(--yellow);border-left:4px solid #f59e0b;padding:12px 14px;border-radius:12px;margin-top:12px}.lesson,.practice{padding:20px;margin-top:14px}.qa{display:grid;grid-template-columns:minmax(220px,.8fr) 1.7fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}.q,.a{padding:11px 13px;border-bottom:1px solid var(--line)}.q{background:#f8fafc;font-weight:900}.a{background:#fff}.qa>div:nth-last-child(-n+2){border-bottom:0}.exact{font-weight:900;color:#166534}.example{color:#1d4ed8}.small{font-size:13px;color:var(--muted)}.tabbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.tabbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:900;cursor:pointer}.tabbar button.active{background:#eaf3ff;border-color:#93c5fd;color:#1d4ed8}.hidden{display:none}.warn{color:#92400e;font-weight:800}@media(max-width:720px){.qa{grid-template-columns:1fr}.q{border-bottom:0}.a{border-bottom:1px solid var(--line)}}@media print{body{background:#fff}.hero .row,.tabbar{display:none}.lesson,.practice{break-inside:avoid;box-shadow:none}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">교사용 · 모범답안</span><h1>데이터로 발견하는 우리 생활</h1><p>현재 학생 웹앱의 1~8차시 활동과 혼자 연습 문항에 맞춘 답안입니다. 숫자형 문항은 현재 웹앱의 생성 데이터 기준이며, 서술형은 하나의 정답이 아니라 <strong>적절한 예시 답안</strong>입니다.</p><div class="note"><strong>지도 원칙</strong> · 2차시 문제 선정, 그래프 해석, 의사결정, 한계 작성은 학생 답이 아래 문장과 달라도 데이터 근거와 논리가 타당하면 인정하세요. 거제 날씨 데이터는 수업용 모의 데이터이므로 실제 공식 관측치처럼 안내하지 않습니다.</div><div class="row" style="margin-top:12px"><a class="btn" href="./teacher.html">← 교사용 웹앱</a><button class="btn" onclick="window.print()">인쇄/PDF</button></div></section><div class="tabbar" id="tabs"></div><section id="common"></section><section id="practice" class="hidden"></section></main><script>
const lessons=[
{n:1,t:'편의점에도 데이터가 있을까?',rows:[['구매하면서 생길 수 있는 데이터 3가지','상품명, 가격, 구매 시각'],['그중 숫자 데이터 한 가지','가격 또는 수량'],['그중 문자 데이터 한 가지','상품명 또는 날씨'],['디지털로 저장하면 좋은 점 한 가지','많은 기록을 빠르게 저장·검색·정렬하고 비교할 수 있다.'],['오늘 학교에서 내가 만든 데이터 한 가지','예: 급식 식수 인원, 출석 기록, 도서 대출 기록'],['우리 반 공유 예시','예: 오늘 우리 반의 출석 인원도 생활 속 데이터이다.'],['친구 글을 보고 새롭게 떠올린 데이터','예: 도서관에서 빌린 책의 제목과 대출 날짜']]},
{n:2,t:'내가 해결하고 싶은 문제를 데이터 질문으로',rows:[['문제 후보 1','급식 만족도가 높은 날에는 잔반율이 낮을까?'],['문제 후보 2','거제 중학교는 학교별 학생 수 차이가 얼마나 날까?'],['내가 선택한 문제','급식 만족도와 잔반율의 관계를 알아보고 싶다.'],['선택 이유','학생들이 매일 경험하는 문제이고 음식물 쓰레기를 줄이는 데 활용할 수 있기 때문이다.'],['필요한 데이터 3~5개','날짜, 주메뉴, 메뉴 종류, 만족도, 잔반율'],['처음 만든 데이터 질문','만족도가 높은 날과 낮은 날의 평균 잔반율은 얼마나 다를까?'],['짝 피드백 예시','메뉴 종류에 따라서도 잔반율이 달라질 수 있으니 메뉴 종류도 함께 살펴보면 좋겠다.'],['최종 탐구 질문','만족도 4.0 이상인 날과 그렇지 않은 날의 평균 잔반율을 비교하고, 메뉴 종류별 차이도 있는지 확인해 보자.'],['좋은 친구 질문의 장점','비교 기준이 분명하고 어떤 데이터가 필요한지 알 수 있다.']]},
{n:3,t:'20행 데이터부터 살펴보자',rows:[['한 행의 의미','하루의 편의점 기록'],['한 열의 의미','같은 종류의 속성 값을 모아 둔 것. 예: 기온 열에는 각 날짜의 기온이 들어 있다.'],['가장 높은 기온','18.2℃','exact'],['비 또는 강한 비가 온 날','4일','exact'],['범주형/수치형 예','범주형: 날씨 또는 요일 / 수치형: 기온, 강수량, 방문객 수 등'],['200행이면 어려운 점','원하는 값을 눈으로 찾기 어렵고, 빠뜨리거나 잘못 세기 쉽다.'],['정렬·필터 중 유용한 기능','예: 필터가 더 유용했다. 비가 온 날만 골라 볼 수 있어 비교가 쉬웠다.']]},
{n:4,t:'비 오는 날 우산이 정말 더 팔릴까?',rows:[['분석 전 예상','비/강한 비가 온 날'],['비/강한 비 날 우산 평균','약 13.7개','exact'],['맑은 날 우산 평균','약 0.8개','exact'],['두 평균의 차이','약 12.9개','exact'],['아이스크림은 어느 쪽이 더 많은가','맑은 날. 60행 기준 맑은 날 평균 약 3.9개, 비 오는 날 약 1.0개.'],['공유 문장','내 예상과 같았다. 비 오는 날 우산 평균은 약 13.7개, 맑은 날은 약 0.8개로 약 12.9개 차이가 났다.'],['친구와 공통 확인 사실','비가 온 날의 우산 평균 판매량이 맑은 날보다 훨씬 높았다.']]},
{n:5,t:'240행 데이터에서 그래프로 관계 찾기',rows:[['날씨별 평균 우산 판매 비교','막대그래프','exact'],['날짜별 방문객 수 변화','꺾은선그래프','exact'],['기온과 아이스크림 판매량 관계','산점도','exact'],['그래프에서 발견한 사실','이번 데이터에서는 기온이 높을수록 아이스크림 판매량이 증가하는 경향이 나타났다.'],['원인까지 바로 단정하면 안 되는 이유','두 값이 함께 변해도 계절, 비 여부, 방문객 수, 행사 같은 다른 요인이 영향을 줄 수 있기 때문이다.'],['공유 문장','이번 데이터에서는 기온이 높아질수록 아이스크림 판매량이 증가하는 경향이 나타났다.'],['근거가 분명한 친구 표현','예: “기온이 높은 구간에서 아이스크림 판매량도 대체로 높게 나타났다.”']]},
{n:6,t:'내가 편의점 점주라면?',rows:[['우산 발주','늘린다','exact'],['아이스크림 발주','유지한다','exact'],['컵라면 발주','늘린다','exact'],['수치 근거 1','240행 기준 비 오는 날 우산 평균 판매량은 약 13.5개이고, 맑은 날은 약 0.8개이다.'],['수치 근거 2','비 오는 날 컵라면 평균 판매량은 약 17.9개이고, 맑은 날은 약 9.8개이다.'],['아이스크림 판단 참고','비 오는 날 아이스크림 평균은 약 15.6개로 맑은 날 약 23.2개보다 낮지만, 내일 기온이 24℃이므로 우선 유지하고 실제 상황을 추가 확인할 수 있다.'],['이 데이터만으로 알 수 없는 점','할인 행사, 재고, 요일, 주변 행사, 계절 변화, 경쟁 점포 상황 등'],['반 투표 후 성찰','예: 결정은 달라지지 않았다. 친구들의 의견도 확인했지만 비 오는 날 우산 평균 판매량 차이가 커서 늘리는 판단을 유지했다.']]},
{n:7,t:'새로운 거제 날씨 데이터에도 통할까?',rows:[['일강수량이 가장 큰 날','2026-07-17','exact'],['그날 일강수량','41mm','exact'],['최대 시간당 강수량이 가장 큰 날','2026-07-17','exact'],['두 값의 차이','일강수량은 하루 동안 내린 비의 총량이고, 최대 시간당 강수량은 그날 한 시간 동안 가장 많이 내린 비의 양이다.'],['편의점 분석과 같은 방법','일강수량을 내림차순으로 정렬하여 가장 큰 값을 찾았다.'],['추가 날씨 분석 질문','일강수량이 많은 날에는 평균풍속도 더 강한 경향이 있을까?']]},
{n:8,t:'데이터로 우리 지역 문제를 생각해 보자',rows:[['야외활동 전 확인할 데이터 3가지','일강수량, 최대 시간당 강수량, 평균풍속'],['현재 데이터 사실 1','180일 모의 데이터에서 일강수량 최댓값은 348mm이며 2026-08-17에 나타난다.'],['현재 데이터 사실 2','최대 시간당 강수량 최댓값은 79mm이며 2026-08-16에 나타난다.'],['추가로 필요한 정보','최신 일기예보, 기상특보, 활동 시간대의 날씨, 학교 주변 도로·침수 상황'],['나의 판단','강한 비나 강풍이 예상된다면 현재 데이터만으로 결정하지 않고 최신 예보와 기상특보, 현장 상황을 함께 확인한 뒤 야외활동을 연기하거나 실내활동으로 바꾸겠다.'],['공유 한 문장','과거 데이터에서 강한 비가 나타난 날이 있었으므로 최신 기상특보와 현장 상황을 함께 확인하여 위험이 예상되면 야외활동을 조정하겠다.'],['8차시 핵심 성찰','문제에 맞는 데이터를 고르고, 분석 결과를 근거로 해석하되 데이터만으로 알 수 없는 한계까지 함께 확인하는 것이 중요하다.']]}
];
const practices=[{t:'🍱 급식 데이터 혼자 연습',rows:[['m1 잔반율이 가장 낮은 날의 주메뉴','햄버거','exact'],['m2 만족도 4.0 이상인 날 평균 잔반율','약 20.9%','exact'],['m3 잔반율 15% 이하인 날','3일','exact'],['m4 만족도와 잔반율 관계','만족도가 높아질수록 잔반율은 대체로 낮아지는 경향','exact'],['m5 밥류/덮밥 평균 잔반율','약 25.5%','exact'],['m6 면류 평균 잔반율','약 27.1%','exact'],['m7 데이터 사실 문장','예: 만족도 4.0 이상인 날의 평균 잔반율은 약 20.9%였다.'],['m8 급식 담당자 제안','만족도가 높은 메뉴의 특징을 더 조사하고, 잔반율이 높은 메뉴는 배식량과 조리 방법을 함께 점검해 볼 수 있다.'],['m9 한계/추가 데이터','메뉴 전체 구성, 실제 배식량, 요일·시험기간·행사 여부 등 다른 요인도 필요하다.'],['도전 활동','예: 시험기간 여부, 메뉴 전체 구성, 배식량, 날씨 등']]},{t:'🏫 거제 중학교 현황 혼자 연습',rows:[['s1 학생수가 가장 많은 학교','거제중앙중학교(1,011명)','exact'],['s2 학생수가 가장 적은 학교','동부중학교(36명)','exact'],['s3 공립 중학교 수','15개교','exact'],['s4 사립 중학교 수','5개교','exact'],['s5 학급수가 가장 많은 학교','거제중앙중학교(38학급)','exact'],['s6 수월중 학생수 순위','2번째(940명)','exact'],['s7 수월중 학급수 순위','2번째(35학급)','exact'],['s8 학생수 500명 이상 학교','11개교','exact'],['s9 데이터 사실 문장','예: 20개 중학교의 학생 수는 36명부터 1,011명까지 차이가 있으며, 수월중학교는 940명으로 두 번째로 많다.'],['s10 추가 데이터','학교 주변 학령인구, 통학구역, 인근 초등학교 졸업생 수, 지역별 인구 변화, 주거단지 개발 현황 등이 필요하다.'],['도전 활동','예: 학교 규모 차이를 설명하려면 학교 주변 학령인구와 통학구역별 학생 수 자료가 필요하다.']] }];
function qa(rows){return `<div class="qa">${rows.map(r=>`<div class="q">${r[0]}</div><div class="a ${r[2]==='exact'?'exact':'example'}">${r[1]}</div>`).join('')}</div>`}function renderCommon(){common.innerHTML=lessons.map(x=>`<section class="lesson"><span class="badge">${x.n}차시</span><h2>${x.t}</h2>${qa(x.rows)}</section>`).join('')}function renderPractice(){practice.innerHTML=practices.map(x=>`<section class="practice"><h2>${x.t}</h2>${qa(x.rows)}</section>`).join('')}function setTab(which){document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('active',(which==='common'?i===0:i===1)));common.classList.toggle('hidden',which!=='common');practice.classList.toggle('hidden',which!=='practice')}tabs.innerHTML='<button class="active" onclick="setTab(\'common\')">1~8차시 모범답안</button><button onclick="setTab(\'practice\')">혼자 연습 모범답안</button>';renderCommon();renderPractice();</script></body></html>
