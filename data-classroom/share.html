<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 데이터 공유</title><style>:root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#667085;--primary:#2563eb;--green:#15803d;--purple:#7c3aed;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1060px;margin:auto;padding:24px 16px 70px}.hero,.panel,.card,.post{background:#fff;border:1px solid var(--line);border-radius:20px}.hero{padding:26px;background:linear-gradient(135deg,#ecfdf5,#fff 60%,#eef2ff)}h1,h2,h3{letter-spacing:-.03em}.small{font-size:13px;color:var(--muted)}.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.student{margin-top:10px;background:#ecfdf3;border:1px solid #bbf7d0;border-radius:12px;padding:10px;font-weight:900;color:#166534}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:900}.tabs button.active{background:#eef2ff;border-color:#a5b4fc;color:#4338ca}.panel{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:16px}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff}.field textarea{min-height:86px}.btn{border:0;border-radius:11px;padding:9px 13px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--primary);color:#fff}.green{background:var(--green);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#344054}.note{background:#fff8e7;border-left:4px solid var(--orange);padding:11px 13px;border-radius:11px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.post{padding:14px}.post h4{margin:5px 0}.meta{font-size:12px;color:var(--muted)}.like{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:6px 9px;font-weight:800}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:13px;font-weight:800;color:#475467}.poll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.poll div{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.hidden{display:none!important}@media(max-width:760px){.grid,.gallery,.poll{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">우리 반 공유 활동</span><h1>다른 사람의 생각을 보고<br>내 질문을 더 좋게 만들어 보자</h1><p>정답을 베끼는 게시판이 아니라 <strong>문제 아이디어·해석·의사결정</strong>을 서로 비교하는 공간입니다.</p><div id="studentInfo" class="student"></div><div class="row" style="margin-top:12px"><a class="btn secondary" href="./">공통 수업</a><a class="btn secondary" href="./start.html">시작 화면</a></div></section><div class="tabs"><button id="t2" onclick="openTab(2)">2차시 · 문제 아이디어</button><button id="t5" onclick="openTab(5)">5차시 · 그래프 해석</button><button id="t6" onclick="openTab(6)">6차시 · 점주 결정</button><button id="t8" onclick="openTab(8)">8차시 · 최종 생각</button></div><section class="panel"><div id="activity"></div><hr style="border:0;border-top:1px solid #e5e7eb;margin:20px 0"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">우리 반 공유 갤러리</h2><div id="serverState" class="small"></div></div><button class="btn secondary" onclick="loadPosts()">새로고침</button></div><div id="gallery" class="gallery"></div></section></main><script>
const PROFILE_KEY='data-classroom-profile-v8',LOCAL_KEY='data-classroom-share-local-v1',BASE='data-classroom-practice';let profile={};try{profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(e){}if(!(profile.studentClass&&profile.studentNo&&profile.studentName))location.replace('./start.html?next=share'+(location.search?'&'+location.search.slice(1):''));const qp=new URLSearchParams(location.search),API=qp.get('api')||localStorage.getItem(BASE+'-api')||'',TOKEN=qp.get('token')||localStorage.getItem(BASE+'-token')||'';if(API)localStorage.setItem(BASE+'-api',API);if(TOKEN)localStorage.setItem(BASE+'-token',TOKEN);studentInfo.textContent=`${profile.studentClass} ${profile.studentNo}번 ${profile.studentName}`;let current=2,local={};try{local=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')}catch(e){}function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(local))}function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function formVal(id){return document.getElementById(id)?.value.trim()||''}function openTab(n){current=n;[2,5,6,8].forEach(x=>document.getElementById('t'+x).classList.toggle('active',x===n));renderActivity();loadPosts()}
function renderActivity(){let saved=local[current]||{};if(current===2){activity.innerHTML=`<span class="badge">2차시 핵심 활동</span><h2>내가 해결하고 싶은 문제를 직접 정해보자</h2><div class="note">먼저 혼자 3분 생각 → 짝과 2분 이야기 → 질문을 다듬어 반에 공유합니다.</div><div class="grid"><div class="card"><h3>① 문제 후보 만들기</h3><div class="field"><label>관심 주제</label><select id="topic"><option>편의점</option><option>학교 급식</option><option>거제 중학교 현황</option><option>거제 날씨</option><option>청소년 생활</option><option>직접 입력</option></select></div><div class="field"><label>내가 해결하고 싶은 문제</label><textarea id="problem" placeholder="예: 급식 잔반을 줄이려면 어떤 메뉴를 살펴봐야 할까?">${esc(saved.problem||'')}</textarea></div><div class="field"><label>데이터로 확인 가능한 질문</label><textarea id="question" placeholder="예: 메뉴별 평균 잔반율은 얼마나 다를까?">${esc(saved.question||'')}</textarea></div><div class="field"><label>필요한 데이터 3가지 이상</label><textarea id="needed">${esc(saved.needed||'')}</textarea></div></div><div class="card"><h3>② 친구와 질문 바꾸어 읽기</h3><p class="small">짝에게 내 질문을 보여주고 아래 두 가지를 확인하세요.</p><div class="field"><label>친구가 이해하기 쉬웠던 점</label><textarea id="peerGood">${esc(saved.peerGood||'')}</textarea></div><div class="field"><label>친구 의견을 반영해 바꾼 점</label><textarea id="peerFix">${esc(saved.peerFix||'')}</textarea></div><div class="field"><label>최종 공유 제목</label><input id="title" value="${esc(saved.title||'')}" placeholder="예: 급식 잔반 줄이기"></div></div></div><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="saveDraft2()">내 기록 저장</button><button class="btn green" onclick="publish2()">우리 반에 질문 공유</button></div>`}else if(current===5){activity.innerHTML=`<span class="badge">5차시 공유</span><h2>그래프 한 줄 해석 릴레이</h2><p>그래프에서 찾은 사실을 <strong>원인 단정 없이</strong> 한 문장으로 표현해 공유합니다.</p><div class="field"><label>내 해석 문장</label><textarea id="shareText" placeholder="이번 데이터에서는 ...한 경향이 나타났다.">${esc(saved.text||'')}</textarea></div><button class="btn green" onclick="publishSimple('그래프 해석','graph')">해석 공유</button>`}else if(current===6){activity.innerHTML=`<span class="badge">6차시 공유</span><h2>편의점 점주 의사결정 투표</h2><p>내일 비가 온다고 할 때 <strong>우산 발주</strong>를 어떻게 할지 고르고 수치 근거를 씁니다.</p><div class="field"><label>나의 결정</label><select id="decision"><option value="늘린다">늘린다</option><option value="유지한다">유지한다</option><option value="줄인다">줄인다</option></select></div><div class="field"><label>수치가 들어간 이유</label><textarea id="shareText">${esc(saved.text||'')}</textarea></div><button class="btn green" onclick="publishDecision()">결정 공유</button><div id="poll" class="poll" style="margin-top:14px"></div>`}else{activity.innerHTML=`<span class="badge">8차시 공유</span><h2>데이터 활용 한 문장 전시</h2><p><strong>데이터가 알려준 것 + 추가로 필요한 정보 + 내가 내린 판단</strong>을 한 문장으로 연결합니다.</p><div class="field"><label>나의 최종 문장</label><textarea id="shareText">${esc(saved.text||'')}</textarea></div><button class="btn green" onclick="publishSimple('최종 데이터 활용','final')">최종 생각 공유</button>`}}
function saveDraft2(){local[2]={problem:formVal('problem'),question:formVal('question'),needed:formVal('needed'),peerGood:formVal('peerGood'),peerFix:formVal('peerFix'),title:formVal('title')};saveLocal();alert('내 기록을 저장했습니다.')}function publish2(){saveDraft2();let x=local[2];if(!x.problem||!x.question){alert('문제와 데이터 질문을 먼저 작성하세요.');return}publish({lesson:2,kind:'question',title:x.title||'나의 데이터 질문',text:`문제: ${x.problem}\n질문: ${x.question}\n필요 데이터: ${x.needed}`})}function publishSimple(title,kind){let text=formVal('shareText');if(!text){alert('공유할 내용을 작성하세요.');return}local[current]={text};saveLocal();publish({lesson:current,kind,title,text})}function publishDecision(){let text=formVal('shareText'),decision=document.getElementById('decision').value;if(!text){alert('수치 근거를 작성하세요.');return}local[6]={text,decision};saveLocal();publish({lesson:6,kind:'decision',title:`우산 발주: ${decision}`,text,extra:{decision}})}
async function publish(x){if(!API||!TOKEN){alert('공유 서버가 아직 연결되지 않았습니다. 선생님이 Apps Script 주소가 포함된 링크를 배포하면 실제 반 공유가 활성화됩니다. 내 기록은 이 기기에 저장됩니다.');return}let payload={type:'share',token:TOKEN,profile,lesson:x.lesson,kind:x.kind,title:x.title,text:x.text,extra:x.extra||{}};try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});alert('우리 반에 공유했습니다. 잠시 후 새로고침해 확인하세요.');setTimeout(loadPosts,700)}catch(e){alert('공유하지 못했습니다. 다시 시도하세요.')}}function jsonp(params){return new Promise((resolve,reject)=>{let cb='sharecb_'+Date.now()+'_'+Math.floor(Math.random()*9999),s=document.createElement('script'),timer=setTimeout(()=>{cleanup();reject(new Error('timeout'))},12000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('load'))};let u=new URL(API);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());s.src=u.toString();document.body.appendChild(s)})}async function loadPosts(){if(!API||!TOKEN){serverState.textContent='공유 서버 미연결 · 현재는 내 기록 저장만 가능합니다.';gallery.innerHTML='<div class="empty">선생님이 공유 서버 링크를 연결하면 같은 반 친구들의 글이 여기에 나타납니다.</div>';if(current===6)renderPoll([]);return}serverState.textContent='같은 반 학생의 공유 글만 표시합니다.';try{let d=await jsonp({action:'shares',token:TOKEN,className:profile.studentClass,lesson:current});if(!d.ok)throw new Error(d.error||'조회 실패');renderPosts(d.items||[]);if(current===6)renderPoll(d.items||[])}catch(e){gallery.innerHTML='<div class="empty">공유 글을 불러오지 못했습니다.</div>'}}function renderPosts(items){if(!items.length){gallery.innerHTML='<div class="empty">아직 공유된 글이 없습니다. 첫 번째로 공유해 보세요.</div>';return}gallery.innerHTML=items.map(p=>`<article class="post"><div class="meta">${esc(p.number)}번 ${esc(p.name)} · ${new Date(p.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div><h4>${esc(p.title||'공유 글')}</h4><div style="white-space:pre-wrap">${esc(p.text)}</div><div class="row" style="margin-top:10px"><button class="like" onclick="likePost('${p.id}')">👍 탐구해보고 싶어요 ${p.likes||0}</button>${current===2?`<button class="like" onclick="pickQuestion('${esc(p.title||'질문')}')">이 질문 참고하기</button>`:''}</div></article>`).join('')}async function likePost(postId){if(!API||!TOKEN)return;try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({type:'like',token:TOKEN,profile,postId})});setTimeout(loadPosts,500)}catch(e){}}function pickQuestion(title){local[2]=local[2]||{};local[2].picked=title;saveLocal();alert(`“${title}” 질문을 참고 질문으로 저장했습니다. 종이 활동지에 친구 질문의 좋은 점을 적어보세요.`)}function renderPoll(items){let el=document.getElementById('poll');if(!el)return;let c={늘린다:0,유지한다:0,줄인다:0};items.filter(p=>p.kind==='decision').forEach(p=>{let d=p.extra?.decision;if(c[d]!==undefined)c[d]++});let total=Object.values(c).reduce((a,b)=>a+b,0);el.innerHTML=Object.entries(c).map(([k,v])=>`<div><strong>${k}</strong><br>${v}명 ${total?'('+Math.round(v/total*100)+'%)':''}</div>`).join('')}openTab(2);</script></body></html>
