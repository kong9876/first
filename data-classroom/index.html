<style>
:root{--navy:#17365d;--blue:#d9eaf7;--purple:#e4dfec;--green:#e2f0d9;--teal:#ddebf7;--orange:#fce4d6;--yellow:#fff2cc;--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--line:#e5e7eb;--primary:#2563eb;--ok:#15803d;--bad:#b91c1c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#ffffffef;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin,.wrap{max-width:1120px;margin:auto}.topin{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:-.03em}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:700}.topnav{display:flex;gap:7px;flex-wrap:wrap}.wrap{padding:24px 16px 72px}.hero,.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:22px}.hero{padding:30px;background:linear-gradient(135deg,#eaf3ff,#fff 60%,#f4ecf7)}.hero h1{font-size:clamp(31px,5vw,52px);line-height:1.08;letter-spacing:-.05em;margin:12px 0}.hero p{font-size:17px;color:#475467;max-width:850px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#344054;font-weight:900;font-size:12px}.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary{background:var(--primary);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#344054}.success{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:9px;flex-wrap:wrap}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.lesson-grid{margin-top:16px}.card{padding:18px;box-shadow:0 7px 18px #1f29370a}.card.done{background:#f0fdf4;border-color:#86efac}.card h3{margin:8px 0}.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}.panel{padding:24px}.section{margin-top:22px}.block{border-radius:16px;padding:16px;margin:12px 0}.q{background:var(--blue)}.together{background:var(--purple)}.do{background:var(--green)}.wrapup{background:var(--teal)}.next{background:var(--orange)}.warn{background:#fff8e7;border-left:4px solid #f59e0b}.block h3{margin:0 0 8px}.field{margin:13px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:10px 11px;background:#fff}.field textarea{min-height:86px;resize:vertical}.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800;text-align:left}.choice button.sel{border-color:#93c5fd;background:#eff6ff}.choice button.correct{border-color:#86efac;background:#f0fdf4;color:#166534}.choice button.wrong{border-color:#fecaca;background:#fef2f2;color:#991b1b}.feedback{font-size:13px;font-weight:800;margin-top:5px}.feedback.ok{color:var(--ok)}.feedback.no{color:var(--bad)}.lessonnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.profile{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px;margin-top:14px}.profile input{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:9px 10px}.data-lab{border:1px solid #bfd4ea;background:#fbfdff;border-radius:18px;padding:16px;margin-top:15px}.data-lab h3{margin:0 0 8px}.lab-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:12px 0}.controls select,.controls button{border:1px solid #cbd5e1;border-radius:10px;padding:8px;background:#fff}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.data-table{border-collapse:collapse;width:100%;min-width:850px;font-size:12px}.data-table th,.data-table td{padding:7px 8px;border-bottom:1px solid #edf0f3;text-align:center}.data-table th{background:#f3f4f6;position:sticky;top:0}.pager{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px}.analysis-box{margin-top:12px;padding:13px;border-radius:14px;background:#f8fafc;border:1px solid #dbe3ec}.analysis-grid{display:grid;grid-template-columns:1.2fr 1.2fr 1fr auto;gap:8px}.analysis-grid select,.analysis-grid button{border:1px solid #cbd5e1;border-radius:10px;padding:8px;background:#fff}.result{font-weight:900;color:#1f4e78;margin-top:8px}.chartbox{margin-top:12px}.chartbox canvas{width:100%;height:310px;border:1px solid var(--line);border-radius:12px;background:#fff}.submit-summary{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;max-height:380px;overflow:auto;font-size:13px}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{padding:5px 9px;border-radius:999px;background:#f2f4f7;font-size:12px;font-weight:800}.account{padding:10px 12px;border-radius:12px;background:#fff8e7;border:1px solid #fde68a;font-weight:800;color:#92400e;margin-top:12px}@media(max-width:780px){.grid,.profile,.choice,.controls,.analysis-grid{grid-template-columns:1fr}.topnav{display:none}.hero{padding:23px}.panel{padding:17px}}</style>
</head><body><header class="top"><div class="topin"><div class="brand">데이터로 발견하는 우리 생활<small>중학교 정보 · 8차시 데이터 탐구</small></div><div class="topnav"><button class="btn secondary" onclick="showHome()">홈</button><button class="btn secondary" onclick="showSubmit()">제출 센터</button></div></div></header><main class="wrap"><section id="homeView"><div class="hero"><span class="badge">편의점으로 배우고 → 거제 날씨에 적용하기</span><h1>데이터를 보고<br>근거를 찾아 결정해 보자</h1><p>처음에는 작은 데이터로 시작하고, 20행 → 60행 → 240행으로 점점 늘려가며 데이터 분석 도구가 왜 필요한지 직접 경험합니다.</p><div class="account">활동 내용은 이 기기 브라우저에 자동 저장됩니다. 학교에서 사용하는 본인 노트북으로 접속하세요.</div><div class="profile"><input id="studentClass" placeholder="반 (예: 1반)"><input id="studentNo" placeholder="번호"><input id="studentName" placeholder="이름"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="openLesson(1)">1차시 시작</button><button class="btn secondary" onclick="saveProfile()">학생 정보 저장</button></div><div class="progress"><div id="progressBar"></div></div><div id="progressText" class="small"></div></div><div class="section"><h2>8차시 학습</h2><div id="lessonCards" class="grid lesson-grid"></div></div></section><section id="lessonView" class="hidden"><div id="lessonBox" class="panel"></div></section><section id="submitView" class="hidden"><div class="panel"><span class="badge">제출 센터</span><h2>나의 활동 기록</h2><p class="small">웹앱에서 작성한 내용이 한곳에 모입니다. 먼저 학생 정보와 답안을 확인하세요.</p><div id="submitStatus" class="statusbar"></div><div id="submitSummary" class="submit-summary"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="downloadCSV()">제출용 CSV 만들기</button><button class="btn secondary" onclick="copySummary()">답안 요약 복사</button><button id="classroomBtn" class="btn secondary" onclick="openClassroom()">Classroom 과제 열기</button><button id="directBtn" class="btn success" onclick="directSubmit()">교사에게 바로 보내기</button></div><div id="submitHelp" class="block warn" style="margin-top:14px"></div><div class="row"><button class="btn danger" onclick="resetAll()">이 기기의 활동 기록 지우기</button></div></div></section></main>
<script>
const CLASSROOM_ASSIGNMENT_URL='';const SUBMIT_ENDPOINT='';const STORE_KEY='data-classroom-interactive-v1';const PROFILE_KEY='data-classroom-profile-v1';const DONE_KEY='data-classroom-done-v1';
function rng(seed){let s=seed>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function fmtDate(d){return d.toISOString().slice(0,10)}function dow(d){return ['일','월','화','수','목','금','토'][d.getDay()]}
function makeStore(n=240){const r=rng(20260825),out=[];let d=new Date('2026-05-01T00:00:00');for(let i=0;i<n;i++){let x=new Date(d);x.setDate(d.getDate()+i);let doy=Math.floor((x-new Date(x.getFullYear(),0,0))/86400000);let bt=19+9*Math.sin(2*Math.PI*(doy-120)/365);let temp=Math.round((bt+(r()-.5)*5)*10)/10;let rainP=.22+([5,6,7].includes(x.getMonth())?.13:.03);let rainy=r()<rainP,heavy=rainy&&r()<.12,rain=0,weather='맑음';if(rainy){rain=Math.max(1,Math.round((-Math.log(Math.max(.001,1-r()))*14)+(heavy?35:0)));weather=heavy?'강한 비':'비';temp=Math.round((temp-(.5+r()*2))*10)/10}else if(r()<.18){weather='흐림'}let wd=dow(x),week=['토','일'].includes(wd);let visitors=Math.max(80,Math.round(165+(week?28:0)+Math.max(temp-20,0)*2-rain*.25+(r()-.5)*36));let umb=Math.max(0,Math.round((rainy?10+rain*.32:1)+(r()-.5)*5));let ice=Math.max(1,Math.round(4+Math.max(temp-20,0)*2.8-(rainy?9:0)+(r()-.5)*8));let noodle=Math.max(3,Math.round(11+(rainy?5:0)+Math.max(17-temp,0)*.5+(r()-.5)*6));out.push({date:fmtDate(x),weekday:wd,weather,temp,rain,visitors,umbrella:umb,icecream:ice,noodle});}return out}
function makeWeather(n=180){const r=rng(817),out=[];let d=new Date('2026-07-01T00:00:00');for(let i=0;i<n;i++){let x=new Date(d);x.setDate(d.getDate()+i);let doy=Math.floor((x-new Date(x.getFullYear(),0,0))/86400000);let temp=Math.round((25+5*Math.sin(2*Math.PI*(doy-190)/365)+(r()-.5)*3.6)*10)/10;let rainP=[6,7,8].includes(x.getMonth())?.32:.20,daily=0,hourly=0;if(r()<rainP){daily=Math.max(1,Math.round(-Math.log(Math.max(.001,1-r()))*20));hourly=Math.max(1,Math.round(daily*(.22+r()*.36)))}let ds=fmtDate(x);if(ds==='2026-08-15'){daily=238;hourly=61}if(ds==='2026-08-16'){daily=326;hourly=79}if(ds==='2026-08-17'){daily=348;hourly=68}let wind=Math.round(Math.max(.4,1.3+r()*2.3+(daily>80?1.2:0))*10)/10;let humidity=Math.round(clamp(67+(daily>0?12:0)+(r()-.5)*16,45,99));out.push({date:ds,daily,hourly,temp,wind,humidity});}return out}const STORE=makeStore(240),WEATHER=makeWeather(180);
const lessons=[{n:1,title:'편의점에도 데이터가 있을까?',size:'예시 몇 개',question:'내가 물건을 하나 사면 어떤 데이터가 생길까?',goal:'생활 속 데이터의 예를 찾고, 왜 저장하는지 설명할 수 있어요.',together:'편의점에서 삼각김밥과 음료를 산 상황을 떠올려 상품명·가격·날짜·시간처럼 남는 기록을 함께 찾아봅니다.',fields:[{id:'l1a',label:'생길 수 있는 데이터 3가지',type:'textarea',ph:'예: 상품명, 가격, ...'},{id:'l1b',label:'편의점은 왜 이 데이터를 저장할까?',type:'textarea'},{id:'l1c',label:'오늘 내가 만든 데이터 한 가지',type:'text'}],wrap:'데이터는 관찰·측정·기록으로 얻은 값이나 사실이며, 모아 두면 문제 해결과 판단에 활용할 수 있어요.',next:'내일 비가 온다면 편의점은 무엇을 더 준비해야 할까요?'},{n:2,title:'내일 비가 온다면 무엇을 준비해야 할까?',size:'예시 몇 개',question:'답을 정하려면 어떤 데이터가 필요할까?',goal:'실생활 문제를 데이터로 확인할 수 있는 질문으로 바꿀 수 있어요.',together:'“비가 오면 우산이 잘 팔릴 것 같다”는 것은 예상입니다. 실제로 확인하려면 어떤 데이터가 필요한지 함께 정합니다.',fields:[{id:'l2a',label:'나의 예상',type:'text',ph:'비가 오면 ______이 더 많이 팔릴 것 같다.'},{id:'l2b',label:'확인에 필요한 데이터 3~5개',type:'textarea'},{id:'l2c',label:'데이터 질문 만들기',type:'text',ph:'비 오는 날과 맑은 날의 ______ 판매량은 얼마나 다를까?'}],wrap:'문제를 해결하려면 먼저 무엇을 확인할지 정하고, 그 질문에 필요한 데이터를 골라야 해요.',next:'다음 시간에는 20행의 작은 편의점 데이터 표를 엽니다.'},{n:3,title:'편의점 데이터를 살펴보자',size:'20행',question:'이 표는 무엇을 말하고 있을까?',goal:'20행 데이터에서 행·열을 이해하고 정렬·필터로 필요한 값을 찾을 수 있어요.',together:'처음에는 20행만 봅니다. 한 행은 하루의 기록, 한 열은 같은 종류의 데이터라는 점을 확인하고 정렬·필터를 따라 합니다.',dataset:'store20',fields:[{id:'l3a',label:'한 행은 무엇을 뜻할까?',type:'choice',choices:['하루의 편의점 기록','상품 하나의 가격표','학생 한 명의 정보','한 달 전체의 평균'],answer:0},{id:'l3b',label:'가장 높은 최고기온(℃)',type:'number',check:'maxTemp20'},{id:'l3c',label:'비 또는 강한 비가 온 날은 총 며칠?',type:'number',check:'rainDays20'}],wrap:'행은 하나의 기록, 열은 같은 특징을 모아 둔 속성이에요.',next:'다음에는 60행으로 늘려 두 집단을 비교합니다.'},{n:4,title:'정말 비 오는 날 우산이 많이 팔릴까?',size:'60행',question:'두 상황을 어떻게 비교하면 좋을까?',goal:'60행 데이터를 이용해 비 오는 날과 맑은 날의 평균을 비교할 수 있어요.',together:'60행부터는 눈으로 하나씩 세기 어렵습니다. 분석 도구를 이용해 비/맑음 집단의 평균을 비교합니다.',dataset:'store60',fields:[{id:'l4a',label:'비 오는 날(강한 비 포함) 우산 평균 판매량',type:'number',check:'rainUmb60'},{id:'l4b',label:'맑은 날 우산 평균 판매량',type:'number',check:'sunUmb60'},{id:'l4c',label:'비교 결과를 한 문장으로 쓰기',type:'textarea',ph:'이번 데이터에서는 ...'}],wr let state=JSON.parse(localStorage.getItem(STORE_KEY)||'{}'),done=new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]')),profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{"studentClass":"","studentNo":"","studentName":""}');let currentLesson=1,labPage=0,labSort=null,labAsc=true,labFilter='all';const PAGE_SIZE=15;
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}function saveDone(){localStorage.setItem(DONE_KEY,JSON.stringify([...done]))}function saveProfile(){profile={studentClass:document.getElementById('studentClass').value.trim(),studentNo:document.getElementById('studentNo').value.trim(),studentName:document.getElementById('studentName').value.trim()};localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));renderHome();alert('학생 정보를 저장했습니다.')}function loadProfile(){document.getElementById('studentClass').value=profile.studentClass||'';document.getElementById('studentNo').value=profile.studentNo||'';document.getElementById('studentName').value=profile.studentName||''}function showOnly(id){['homeView','lessonView','submitView'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}function showHome(){showOnly('homeView');renderHome();loadProfile()}function renderHome(){document.getElementById('lessonCards').innerHTML=lessons.map(x=>`<div class="card ${done.has(x.n)?'done':''}"><span class="badge">${x.n}차시 · ${x.size}</span><h3>${x.title}</h3><div class="small">${x.question}</div><button class="btn ${done.has(x.n)?'success':'primary'}" style="margin-top:12px" onclick="openLesson(${x.n})">${done.has(x.n)?'다시 보기':'학습 시작'}</button></div>`).join('');document.getElementById('progressBar').style.width=(done.size/8*100)+'%';document.getElementById('progressText').textContent=`학습 진행 ${done.size}/8차시`}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function attr(s){return String(s).replace(/"/g,'&quot;')}function setAnswer(id,v){state[id]=v;saveState()}function fieldHTML(f){const val=state[f.id]??'';if(f.type==='textarea')return `<div class="field"><label>${f.label}</label><textarea id="${f.id}" placeholder="${f.ph||''}" oninput="setAnswer('${f.id}',this.value)">${esc(val)}</textarea><div id="fb_${f.id}" class="feedback"></div></div>`;if(f.type==='choice')return `<div class="field"><label>${f.label}</label><div class="choice">${f.choices.map((c,i)=>`<button type="button" class="${String(val)===String(i)?'sel':''}" onclick="choose('${f.id}',${i},${f.answer})">${c}</button>`).join('')}</div><div id="fb_${f.id}" class="feedback"></div></div>`;return `<div class="field"><label>${f.label}</label><input id="${f.id}" type="${f.type==='number'?'number':'text'}" step="any" value="${attr(val)}" placeholder="${f.ph||''}" oninput="setAnswer('${f.id}',this.value)"><div id="fb_${f.id}" class="feedback"></div></div>`}function choose(id,i,ans){state[id]=i;saveState();openLesson(currentLesson);setTimeout(()=>{const fb=document.getElementById('fb_'+id);if(fb){fb.textContent=i===ans?'✓ 잘 골랐어요.':'다시 생각해 보세요.';fb.className='feedback '+(i===ans?'ok':'no')}},20)}
function openLesson(n){currentLesson=n;labPage=0;labSort=null;labAsc=true;labFilter='all';const x=lessons[n-1];showOnly('lessonView');document.getElementById('lessonBox').innerHTML=`<span class="badge">${n}차시 · 데이터 ${x.size}</span><h2>${x.title}</h2><p class="small">오늘의 목표: ${x.goal}</p><div class="block q"><h3>❓ 오늘의 질문</h3>${x.question}</div><div class="block together"><h3>👩‍🏫 선생님과 같이</h3>${x.together}</div>${x.dataset?labHTML(x):''}<div class="block do"><h3>✍️ 바로 해보기</h3>${x.fields.map(fieldHTML).join('')}<div class="row"><button class="btn secondary" onclick="checkLesson(${n})">내 답 확인하기</button></div></div><div class="block wrapup"><h3>💡 오늘 알게 된 것</h3>${x.wrap}</div><div class="block next"><h3>➡️ 다음 이야기</h3>${x.next}</div><div class="lessonnav"><button class="btn secondary" onclick="${n===1?'showHome()':`openLesson(${n-1})`}">← 이전</button><button class="btn primary" onclick="completeLesson(${n})">${n}차시 완료</button><button class="btn secondary" onclick="${n===8?'showSubmit()':`openLesson(${n+1})`}">${n===8?'제출 센터':'다음 →'}</button></div>`;if(x.dataset)renderLab();if(x.chart)setTimeout(drawChart,30)}
function datasetFor(key){if(key==='store20')return STORE.slice(0,20);if(key==='store60')return STORE.slice(0,60);if(key==='store240')return STORE;if(key==='weather60')return WEATHER.slice(0,60);return WEATHER}function headersFor(key){return key.startsWith('store')?[['date','날짜'],['weekday','요일'],['weather','날씨'],['temp','최고기온(℃)'],['rain','강수량(mm)'],['visitors','방문객수'],['umbrella','우산판매'],['icecream','아이스크림판매'],['noodle','컵라면판매']]:[['date','날짜'],['daily','일강수량(mm)'],['hourly','최대시간강수량(mm)'],['temp','평균기온(℃)'],['wind','평균풍속(m/s)'],['humidity','습도(%)']]}
function labHTML(x){return `<div class="data-lab"><div class="lab-head"><div><h3>🔎 데이터 실험실</h3><div class="small">현재 데이터: ${x.size}. 표는 한 번에 15행씩 보여줍니다.</div></div><span class="badge">${x.dataset.includes('store')?'편의점':'거제 날씨'}</span></div><div class="controls"><select id="sortCol" onchange="setSort(this.value)"></select><select id="filterVal" onchange="setFilter(this.value)"></select><select id="sortDir" onchange="setDir(this.value)"><option value="asc">오름차순</option><option value="desc">내림차순</option></select><button onclick="resetLab()">초기화</button></div><div class="tablewrap"><table class="data-table"><thead id="dataHead"></thead><tbody id="dataBody"></tbody></table></div><div class="pager"><button class="btn secondary" onclick="movePage(-1)">← 이전 15행</button><span id="pageInfo" class="small"></span><button class="btn secondary" onclick="movePage(1)">다음 15행 →</button></div><div class="analysis-box"><strong>간단 분석 도구</strong><div class="small">조건을 정해 개수·평균·최댓값을 확인해 보세요.</div><div class="analysis-grid"><select id="metric"></select><select id="cond"></select><select id="stat"><option value="avg">평균</option><option value="max">최댓값</option><option value="min">최솟값</option><option value="count">개수</option></select><button onclick="runAnalysis()">분석 실행</button></div><div id="analysisResult" class="result"></div></div>${x.chart?`<div class="chartbox"><strong>그래프 실험실</strong><div class="row" style="margin:8px 0"><select id="chartPreset"><option value="umb">날씨별 평균 우산 판매량</option><option value="vis">날짜별 방문객 수 변화</option><option value="ice">기온과 아이스크림 판매량 관계</option></select><button class="btn secondary" onclick="drawChart()">그래프 그리기</button></div><canvas id="chartCanvas" width="900" height="310"></canvas></div>`:''}</div>`}
function labData(){const x=lessons[currentLesson-1];let data=datasetFor(x.dataset).slice();if(labFilter!=='all'&&x.dataset.startsWith('store'))data=data.filter(r=>labFilter==='rain'?['비','강한 비'].includes(r.weather):r.weather===labFilter);if(labSort)data.sort((a,b)=>{let av=a[labSort],bv=b[labSort];if(typeof av==='string')return labAsc?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));return labAsc?av-bv:bv-av});return data}
function renderLab(){const x=lessons[currentLesson-1],headers=headersFor(x.dataset),sort=document.getElementById('sortCol'),filter=document.getElementById('filterVal'),metric=document.getElementById('metric'),cond=document.getElementById('cond');sort.innerHTML='<option value="">정렬할 열 선택</option>'+headers.map(h=>`<option value="${h[0]}" ${labSort===h[0]?'selected':''}>${h[1]}</option>`).join('');filter.innerHTML=x.dataset.startsWith('store')?'<option value="all">날씨 전체</option><option value="맑음">맑음</option><option value="흐림">흐림</option><option value="rain">비/강한 비</option>':'<option value="all">전체 보기</option>';metric.innerHTML=headers.filter(h=>!['date','weekday','weather'].includes(h[0])).map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');cond.innerHTML=x.dataset.startsWith('store')?'<option value="all">전체</option><option value="sun">맑은 날</option><option value="rain">비/강한 비</option><option value="hot">25℃ 이상</option>':'<option value="all">전체</option><option value="wet">비가 온 날</option><option value="heavy">일강수량 50mm 이상</option>';const data=labData(),pages=Math.max(1,Math.ceil(data.length/PAGE_SIZE));labPage=Math.min(labPage,pages-1);const slice=data.slice(labPage*PAGE_SIZE,(labPage+1)*PAGE_SIZE);document.getElementById('dataHead').innerHTML='<tr>'+headers.map(h=>`<th>${h[1]}</th>`).join('')+'</tr>';document.getElementById('dataBody').innerHTML=slice.map(r=>'<tr>'+headers.map(h=>`<td>${r[h[0]]}</td>`).join('')+'</tr>').join('');document.getElementById('pageInfo').textContent=`${labPage+1}/${pages}쪽 · 조건에 맞는 ${data.length}행`}
function setSort(v){labSort=v||null;labPage=0;renderLab()}function setFilter(v){labFilter=v;labPage=0;renderLab()}function setDir(v){labAsc=v==='asc';renderLab()}function resetLab(){labPage=0;labSort=null;labAsc=true;labFilter='all';renderLab()}function movePage(d){const data=labData(),pages=Math.max(1,Math.ceil(data.length/PAGE_SIZE));labPage=clamp(labPage+d,0,pages-1);renderLab()}
function filteredForAnalysis(){const x=lessons[currentLesson-1],base=datasetFor(x.dataset).slice(),c=document.getElementById('cond')?.value||'all';if(x.dataset.startsWith('store')){if(c==='sun')return base.filter(r=>r.weather==='맑음');if(c==='rain')return base.filter(r=>['비','강한 비'].includes(r.weather));if(c==='hot')return base.filter(r=>r.temp>=25);return base}if(c==='wet')return base.filter(r=>r.daily>0);if(c==='heavy')return base.filter(r=>r.daily>=50);return base}
function runAnalysis(){const arr=filteredForAnalysis(),metric=document.getElementById('metric').value,stat=document.getElementById('stat').value;let out='';if(stat==='count')out=`조건에 맞는 데이터: ${arr.length}행`;else{const vals=arr.map(r=>Number(r[metric])).filter(v=>Number.isFinite(v));let v=stat==='avg'?vals.reduce((a,b)=>a+b,0)/vals.length:stat==='max'?Math.max(...vals):Math.min(...vals);out=`결과: ${Math.round(v*10)/10}`}document.getElementById('analysisResult').textContent=out}
function drawChart(){const canvas=document.getElementById('chartCanvas');if(!canvas)return;const ctx=canvas.getContext('2d'),preset=document.getElementById('chartPreset').value,data=STORE;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#cbd5e1';ctx.strokeRect(45,20,820,250);ctx.fillStyle='#334155';ctx.font='14px sans-serif';if(preset==='umb'){const groups=[['맑음',data.filter(r=>r.weather==='맑음')],['비',data.filter(r=>['비','강한 비'].includes(r.weather))]],vals=groups.map(g=>g[1].reduce((s,r)=>s+r.umbrella,0)/g[1].length),max=Math.max(...vals)*1.2;groups.forEach((g,i)=>{let h=190*vals[i]/max,x=250+i*300;ctx.fillStyle=i===0?'#93c5fd':'#a7f3d0';ctx.fillRect(x,240-h,120,h);ctx.fillStyle='#334155';ctx.fillText(g[0],x+42,265);ctx.fillText((Math.round(vals[i]*10)/10)+'개',x+36,230-h)});ctx.fillText('날씨별 평균 우산 판매량',55,42)}else if(preset==='vis'){let sample=data.filter((_,i)=>i%8===0),min=Math.min(...sample.map(r=>r.visitors)),max=Math.max(...sample.map(r=>r.visitors));ctx.beginPath();sample.forEach((r,i)=>{let x=60+i*(790/(sample.length-1)),y=240-(r.visitors-min)/(max-min||1)*190;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#334155';ctx.fillText('날짜별 방문객 수 변화(일부 간격 표시)',55,42)}else{let minT=Math.min(...data.map(r=>r.temp)),maxT=Math.max(...data.map(r=>r.temp)),maxI=Math.max(...data.map(r=>r.icecream));ctx.fillStyle='#7c3aed';data.forEach(r=>{let x=60+(r.temp-minT)/(maxT-minT||1)*790,y=240-r.icecream/(maxI||1)*190;ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#334155';ctx.fillText('기온과 아이스크림 판매량의 관계',55,42)}}
function checks(){const s20=STORE.slice(0,20),s60=STORE.slice(0,60),w60=WEATHER.slice(0,60),rain60=s60.filter(r=>['비','강한 비'].includes(r.weather)),sun60=s60.filter(r=>r.weather==='맑음'),maxDaily=Math.max(...w60.map(r=>r.daily)),maxHourly=Math.max(...w60.map(r=>r.hourly));return{maxTemp20:Math.max(...s20.map(r=>r.temp)),rainDays20:s20.filter(r=>['비','강한 비'].includes(r.weather)).length,rainUmb60:rain60.reduce((s,r)=>s+r.umbrella,0)/rain60.length,sunUmb60:sun60.reduce((s,r)=>s+r.umbrella,0)/sun60.length,maxDaily60:maxDaily,maxDailyDay60:w60.find(r=>r.daily===maxDaily).date,maxHourlyDay60:w60.find(r=>r.hourly===maxHourly).date}}const CHECK=checks();
function checkLesson(n){const x=lessons[n-1];x.fields.forEach(f=>{const fb=document.getElementById('fb_'+f.id);if(!fb)return;const val=state[f.id];if(f.type==='choice'){const ok=Number(val)===f.answer;fb.textContent=val===''||val===undefined?'답을 선택해 보세요.':ok?'✓ 맞아요.':'다시 생각해 보세요.';fb.className='feedback '+(ok?'ok':'no');return}if(f.check){let target=CHECK[f.check],ok=f.type==='number'?Math.abs(Number(val)-Number(target))<0.6:String(val||'').trim()===String(target);fb.textContent=!val?'답을 입력해 보세요.':ok?'✓ 데이터에서 잘 찾았습니다.':'다시 데이터 표나 분석 도구를 확인해 보세요.';fb.className='feedback '+(ok?'ok':'no')}else{fb.textContent=String(val||'').trim()?'✓ 작성했습니다.':'아직 작성하지 않았어요.';fb.className='feedback '+(String(val||'').trim()?'ok':'no')}})}function completeLesson(n){const x=lessons[n-1],missing=x.fields.filter(f=>state[f.id]===undefined||String(state[f.id]).trim()==='');if(missing.length){alert(`아직 작성하지 않은 활동이 ${missing.length}개 있습니다.`);checkLesson(n);return}done.add(n);saveDone();showHome()}
function summaryText(){let lines=[];lines.push(`학생: ${profile.studentClass||''} ${profile.studentNo||''}번 ${profile.studentName||''}`);lines.push(`완료 차시: ${[...done].sort((a,b)=>a-b).join(', ')||'없음'}`);lines.push('');lessons.forEach(l=>{lines.push(`[${l.n}차시] ${l.title}`);l.fields.forEach(f=>{let v=state[f.id]??'';if(f.type==='choice'&&v!=='')v=f.choices[Number(v)]||v;lines.push(`${f.label}: ${v}`)});lines.push('')});return lines.join('\n')}
function showSubmit(){showOnly('submitView');const filled=lessons.flatMap(l=>l.fields).filter(f=>state[f.id]!==undefined&&String(state[f.id]).trim()!=='').length,total=lessons.flatMap(l=>l.fields).length;document.getElementById('submitStatus').innerHTML=`<span class="pill">완료 ${done.size}/8차시</span><span class="pill">작성 ${filled}/${total}문항</span><span class="pill">학생 ${esc(profile.studentName||'미입력')}</span>`;document.getElementById('submitSummary').textContent=summaryText();const c=document.getElementById('classroomBtn'),d=document.getElementById('directBtn');c.classList.toggle('disabled',!CLASSROOM_ASSIGNMENT_URL);d.classList.toggle('disabled',!SUBMIT_ENDPOINT);document.getElementById('submitHelp').innerHTML=SUBMIT_ENDPOINT?'“교사에게 바로 보내기”를 사용하면 학교 Google Sheet 수집 서버로 답안을 전송합니다.':'현재 버전은 <strong>제출용 CSV 만들기 → Classroom 과제 열기 → 파일 첨부 → 제출</strong> 방식입니다. 학교 계정에서 Apps Script를 연결하면 웹앱에서 교사용 Google Sheet로 바로 전송하는 기능을 켤 수 있습니다.'}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function downloadCSV(){const rows=[['반','번호','이름','차시','활동','답안']];lessons.forEach(l=>l.fields.forEach(f=>{let v=state[f.id]??'';if(f.type==='choice'&&v!=='')v=f.choices[Number(v)]||v;rows.push([profile.studentClass,profile.studentNo,profile.studentName,l.n,f.label,v])}));const text='\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\n'),blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`데이터활동_${profile.studentClass||''}_${profile.studentNo||''}_${profile.studentName||'학생'}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function copySummary(){try{await navigator.clipboard.writeText(summaryText());alert('답안 요약을 복사했습니다.')}catch(e){alert('복사가 차단되었습니다. 제출용 CSV를 이용하세요.')}}function openClassroom(){if(!CLASSROOM_ASSIGNMENT_URL){alert('아직 Classroom 과제 주소가 웹앱에 설정되지 않았습니다. 선생님이 과제 링크를 연결하면 이 버튼을 사용할 수 있습니다.');return}window.open(CLASSROOM_ASSIGNMENT_URL,'_blank')}async function directSubmit(){if(!SUBMIT_ENDPOINT){alert('학교 Google 계정에서 제출 서버를 연결한 뒤 사용할 수 있습니다.');return}if(!profile.studentName){alert('학생 정보를 먼저 저장하세요.');return}const payload={profile,done:[...done],answers:state,submittedAt:new Date().toISOString()};try{await fetch(SUBMIT_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});alert('전송 요청을 보냈습니다. 선생님 안내에 따라 제출 여부를 확인하세요.')}catch(e){alert('전송에 실패했습니다. 제출용 CSV를 이용하세요.')}}function resetAll(){if(!confirm('이 기기의 학생 정보와 모든 활동 기록을 지울까요?'))return;localStorage.removeItem(STORE_KEY);localStorage.removeItem(PROFILE_KEY);localStorage.removeItem(DONE_KEY);state={};profile={studentClass:'',studentNo:'',studentName:''};done=new Set();showHome()}renderHome();loadProfile();
</script></body></html>
