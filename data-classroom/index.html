<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터로 발견하는 우리 생활</title><style>
:root{--navy:#17365d;--blue:#d9eaf7;--purple:#e4dfec;--green:#e2f0d9;--teal:#ddebf7;--orange:#fce4d6;--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}.top{position:sticky;top:0;z-index:10;background:#ffffffee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.topin,.wrap{max-width:1080px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}.wrap{padding:24px 16px 64px}.hero,.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:22px}.hero{padding:32px;background:linear-gradient(135deg,#eaf3ff,#fff 60%,#f4ecf7)}.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.08;margin:12px 0;letter-spacing:-.04em}.hero p{font-size:17px;color:#475467}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#344054;font-weight:800;font-size:12px}.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.row{display:flex;gap:9px;flex-wrap:wrap}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:16px}.progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.card{padding:18px}.card.done{background:#f0fdf4;border-color:#86efac}.card h3{margin:7px 0}.small{font-size:13px;color:var(--muted)}.hidden{display:none}.panel{padding:24px}.block{border-radius:16px;padding:16px;margin:12px 0}.q{background:var(--blue)}.together{background:var(--purple)}.do{background:var(--green)}.wrapup{background:var(--teal)}.next{background:var(--orange)}.block h3{margin:0 0 7px}.steps{padding-left:22px;margin-bottom:0}.steps li{margin:7px 0}.note{padding:12px 14px;border-left:4px solid #f59e0b;background:#fff8e7;border-radius:12px;margin:14px 0}.lessonnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.help{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.help div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.help strong{display:block;color:#17365d}.account{padding:10px 12px;border-radius:12px;background:#fff8e7;border:1px solid #fde68a;font-weight:800;color:#92400e}@media(max-width:750px){.grid,.help{grid-template-columns:1fr}.hero{padding:24px}}</style></head><body><header class="top"><div class="topin"><div class="brand">데이터로 발견하는 우리 생활<small>중학교 정보 · Google Classroom 8차시</small></div><button class="btn secondary" onclick="home()">홈</button></div></header><main class="wrap"><section id="home"><div class="hero"><span class="badge">편의점으로 배우고 → 거제 날씨에 적용하기</span><h1>데이터를 보고<br>근거를 찾아 결정해 보자</h1><p>모두가 같은 주제로 선생님과 함께 배우고, 익숙해진 방법을 새로운 데이터에 다시 적용합니다.</p><div class="account">수업은 Google Classroom에서 선생님이 배포한 학습지를 학교 Google 계정으로 열어 진행합니다.</div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="openLesson(1)">1차시 시작</button></div><div class="progress"><div id="bar"></div></div><div id="prog" class="small"></div></div><div class="help"><div><strong>행</strong>하나의 기록</div><div><strong>열(속성)</strong>같은 종류의 데이터</div><div><strong>평균</strong>여러 값을 대표해 비교하는 값</div><div><strong>그래프</strong>관계·차이를 보기 쉽게 표현</div></div><div id="cards" class="grid"></div></section><section id="lesson" class="hidden"><div id="box" class="panel"></div></section></main><script>const lessons=[{"n":1,"title":"편의점에도 데이터가 있을까?","q":"내가 물건을 하나 사면 어떤 데이터가 생길까?","goal":"생활 속에서 만들어지는 데이터를 찾고, 왜 저장하는지 설명할 수 있어요.","together":"편의점에서 삼각김밥과 음료를 산 상황을 떠올려 상품명·가격·시간·날짜처럼 남는 기록을 함께 찾아봅니다.","do":["생길 수 있는 데이터 3가지를 학습지에 적기","편의점이 이 기록을 왜 저장하는지 한 문장 쓰기","내가 오늘 학교에 오면서 만든 데이터 한 가지 찾기"],"wrap":"데이터는 관찰·측정·기록으로 얻은 값이나 사실이며, 모아 두면 문제 해결과 판단에 활용할 수 있어요.","next":"내일 비가 온다면 편의점은 무엇을 더 준비해야 할까요?"},{"n":2,"title":"내일 비가 온다면 무엇을 준비해야 할까?","q":"답을 정하려면 어떤 데이터가 필요할까?","goal":"실생활 문제를 데이터로 확인할 수 있는 질문으로 바꿀 수 있어요.","together":"'비가 오면 우산이 잘 팔릴 것 같다'는 예상과 실제 데이터를 이용한 확인은 다릅니다. 확인에 필요한 데이터를 함께 고릅니다.","do":["비 오는 날 잘 팔릴 것 같은 상품 예상하기","확인에 필요한 데이터 3~5개 고르기","'비 오는 날과 맑은 날의 ○○ 판매량은 얼마나 다를까?'처럼 질문 만들기"],"wrap":"문제를 해결하려면 먼저 무엇을 확인할지 정하고, 그 질문에 필요한 데이터를 골라야 해요.","next":"이제 실제 편의점 데이터 표를 열어봅니다."},{"n":3,"title":"편의점 데이터를 살펴보자","q":"이 표는 무엇을 말하고 있을까?","goal":"표의 행·열·속성을 이해하고 정렬·필터로 필요한 데이터를 찾을 수 있어요.","together":"Classroom에서 받은 학습지의 DATA_편의점 탭을 엽니다. 한 행=하루 기록, 한 열=같은 종류의 데이터라는 점을 확인하고 정렬·필터를 한 번 같이 해봅니다.","do":["가장 더운 날 찾기","비가 온 날만 필터로 보기","수치형 데이터 2개와 범주형 데이터 2개 찾기"],"wrap":"행은 하나의 기록, 열은 같은 특징을 모아 둔 속성이에요.","next":"비 오는 날 우산이 정말 많이 팔리는지 숫자로 비교합니다."},{"n":4,"title":"정말 비 오는 날 우산이 많이 팔릴까?","q":"두 상황을 어떻게 비교하면 좋을까?","goal":"두 집단의 평균을 비교하고 데이터에 근거한 결론을 쓸 수 있어요.","together":"비 오는 날과 맑은 날의 우산 판매량 평균을 같이 구합니다. 함수는 외우지 않고 선생님이 제공한 식을 이용합니다.","do":["비 오는 날 우산 판매량 평균 구하기","맑은 날 우산 판매량 평균 구하기","아이스크림 판매량도 같은 방법으로 비교하기"],"wrap":"평균을 이용하면 여러 날의 데이터를 한 값으로 요약해 두 집단의 전체적인 차이를 볼 수 있어요.","next":"숫자가 많을 때는 그래프로 바꾸면 더 쉽게 볼 수 있어요."},{"n":5,"title":"숫자를 그래프로 바꾸면 무엇이 보일까?","q":"어떤 그래프가 질문에 가장 잘 맞을까?","goal":"비교·변화·관계에 맞는 그래프를 선택하고 해석할 수 있어요.","together":"막대=집단 비교, 꺾은선=시간 변화, 산점도=두 숫자의 관계라는 세 가지 기준으로 그래프를 선택합니다.","do":["비/맑음 우산 평균을 막대그래프로 만들기","기온과 아이스크림 판매량을 산점도로 만들기","그래프에서 발견한 사실을 수치와 함께 쓰기"],"wrap":"그래프는 데이터를 보기 쉽게 바꾸어 관계와 차이를 빠르게 찾도록 도와줘요.","next":"이제 데이터를 이용해 실제 편의점 운영 결정을 내려봅니다."},{"n":6,"title":"내가 편의점 점주라면?","q":"분석 결과를 실제 결정에 어떻게 사용할까?","goal":"수치 근거를 사용해 실제 의사결정을 제안하고 한계를 말할 수 있어요.","together":"내일 최고기온 24℃, 비가 예상된다는 상황에서 우산·아이스크림·컵라면을 늘릴지 줄일지 함께 한 가지 예를 만들어 봅니다.","do":["세 상품의 발주 결정을 정하기","숫자가 들어간 근거 2개 쓰기","이 데이터만으로 알 수 없는 점 1개 쓰기"],"wrap":"데이터 분석은 정답을 자동으로 주는 것이 아니라, 더 근거 있는 판단을 하도록 도와줘요.","next":"편의점에서 배운 방법이 거제 날씨 데이터에도 통할까요?"},{"n":7,"title":"편의점에서 배운 방법이 날씨에도 통할까?","q":"많은 비가 왔다는 것을 데이터로 어떻게 확인할까?","goal":"새로운 데이터에도 정렬·비교·그래프 방법을 적용할 수 있어요.","together":"DATA_거제날씨 탭을 엽니다. 새로운 함수는 배우지 않고 일강수량과 최대 시간당 강수량을 기존 방법으로 살펴봅니다.","do":["일강수량이 가장 큰 날 찾기","최대 시간당 강수량이 가장 큰 날 찾기","두 값을 함께 그래프로 나타내고 차이를 설명하기"],"wrap":"데이터의 주제가 바뀌어도 질문하고, 살펴보고, 그래프로 표현하고, 해석하는 방법은 다시 사용할 수 있어요.","next":"날씨 데이터는 학교의 안전한 활동 준비에 어떤 도움을 줄까요?"},{"n":8,"title":"데이터로 우리 지역을 이해해보자","q":"날씨 데이터를 활용하면 어떤 판단에 도움을 줄까?","goal":"데이터가 알려주는 사실과 추가로 필요한 정보를 구분해 문제 해결에 활용할 수 있어요.","together":"야외 체험활동을 계획하는 상황을 생각합니다. 학생이 공식 휴교 기준을 만드는 것이 아니라, 어떤 데이터를 확인하고 무엇을 더 알아봐야 하는지 판단합니다.","do":["꼭 확인할 날씨 데이터 3가지 고르기","현재 데이터에서 확인 가능한 사실 2가지 쓰기","예보·기상특보처럼 추가로 필요한 정보 적기","데이터와 추가 정보를 함께 확인해 판단하는 문장 완성하기"],"wrap":"데이터는 현상을 이해하는 근거를 제공하지만, 중요한 결정에는 다른 정보와 상황도 함께 확인해야 해요.","next":"다음 수행평가에서는 새로운 공통 데이터에 이 과정을 혼자 적용합니다."}];const key='data-course-final-v1';let done=new Set(JSON.parse(localStorage.getItem(key)||'[]'));function render(){document.getElementById('cards').innerHTML=lessons.map(x=>`<div class="card ${done.has(x.n)?'done':''}"><span class="badge">${x.n}차시</span><h3>${x.title}</h3><div class="small">${x.q}</div><button class="btn ${done.has(x.n)?'secondary':'primary'}" style="margin-top:12px" onclick="openLesson(${x.n})">${done.has(x.n)?'다시 보기':'학습 시작'}</button></div>`).join('');document.getElementById('bar').style.width=(done.size/8*100)+'%';document.getElementById('prog').textContent=`학습 진행 ${done.size}/8차시`;}function home(){document.getElementById('home').classList.remove('hidden');document.getElementById('lesson').classList.add('hidden');window.scrollTo(0,0)}function openLesson(n){let x=lessons[n-1];document.getElementById('home').classList.add('hidden');document.getElementById('lesson').classList.remove('hidden');document.getElementById('box').innerHTML=`<span class="badge">${x.n}차시</span><h2>${x.title}</h2><p class="small">오늘의 목표: ${x.goal}</p><div class="block q"><h3>❓ 오늘의 질문</h3>${x.q}</div><div class="block together"><h3>👩‍🏫 선생님과 같이</h3>${x.together}</div><div class="block do"><h3>✍️ 내가 해보기</h3><ol class="steps">${x.do.map(v=>`<li>${v}</li>`).join('')}</ol></div><div class="block wrapup"><h3>💡 오늘 알게 된 것</h3>${x.wrap}</div><div class="block next"><h3>➡️ 다음 이야기</h3>${x.next}</div>${n>=3?'<div class="note">실제 계산과 그래프 만들기는 Classroom에서 배포된 개인 학습지에서 합니다. 원본 DATA 탭의 값은 바꾸지 마세요.</div>':''}<div class="lessonnav"><button class="btn secondary" onclick="${n===1?'home()':`openLesson(${n-1})`}">← 이전</button><button class="btn primary" onclick="finish(${n})">${n}차시 완료</button><button class="btn secondary" onclick="${n===8?'home()':`openLesson(${n+1})`}">${n===8?'홈으로':'다음 →'}</button></div>`;window.scrollTo(0,0)}function finish(n){done.add(n);localStorage.setItem(key,JSON.stringify([...done]));render();home()}render();</script></body></html>
