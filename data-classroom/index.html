ion><section id="submit" class="hidden"><div class="panel"><span class="badge">학습 기록</span><h2>8차시 활동 확인</h2><div id="submitStatus" class="small"></div><div id="summary" class="summary"></div><div class="row" style="margin-top:12px"><a id="practiceSubmit" class="btn primary" href="./practice.html">혼자 연습·제출로 이동</a><button class="btn secondary" onclick="showHome()">홈</button></div></div></section></main><script>
const PROFILE_KEY='data-classroom-profile-v8',STORE_KEY='data-classroom-answers-v8',DONE_KEY='data-classroom-done-v8',DRAFT_KEY='data-classroom-share-draft-v2',BASE='data-classroom-practice';let profile={};try{profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(e){}function validProfile(p){return /^([1-9]|1[01])반$/.test(p.studentClass||'')&&Number(p.studentNo)>=1&&Number(p.studentNo)<=40&&String(p.studentName||'').trim().length>=2}if(!validProfile(profile))location.replace('./start.html?next=common'+(location.search?'&'+location.search.slice(1):''));const qp=new URLSearchParams(location.search),API=qp.get('api')||localStorage.getItem(BASE+'-api')||'',TOKEN=qp.get('token')||localStorage.getItem(BASE+'-token')||'';if(API)localStorage.setItem(BASE+'-api',API);if(TOKEN)localStorage.setItem(BASE+'-token',TOKEN);const suffix=new URLSearchParams();if(API)suffix.set('api',API);if(TOKEN)suffix.set('token',TOKEN);const qs=suffix.toString()?'?'+suffix.toString():'';['practiceTop','practiceHome','practiceSubmit'].forEach(id=>{const e=document.getElementById(id);if(e)e.href='./practice.html'+qs});
function rng(seed){let s=seed>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function fmt(d){return d.toISOString().slice(0,10)}function dow(d){return ['일','월','화','수','목','금','토'][d.getDay()]}function makeStore(n=240){const r=rng(20260825),out=[],base=new Date('2026-04-01T00:00:00');for(let i=0;i<n;i++){let x=new Date(base);x.setDate(base.getDate()+i);let m=x.getMonth()+1,temp=Math.round(clamp(15+(m-4)*2.8+(r()-.5)*7,8,36)*10)/10,rainy=r()<(.18+(m>=6&&m<=8?.14:.03)),heavy=rainy&&r()<.12,rain=rainy?Math.round((heavy?35:1)+r()*(heavy?75:28)):0,weather=heavy?'강한 비':rainy?'비':r()<.18?'흐림':'맑음',wd=dow(x),week=['토','일'].includes(wd),visitors=Math.max(70,Math.round(145+(week?30:0)+Math.max(temp-18,0)*1.8-rain*.22+(r()-.5)*38)),umb=Math.max(0,Math.round((rainy?8+rain*.28:.6)+(r()-.5)*4)),ice=Math.max(1,Math.round(3+Math.max(temp-18,0)*2.7-(rainy?7:0)+(r()-.5)*9)),noodle=Math.max(3,Math.round(10+(rainy?8:0)+(r()-.5)*7));out.push({date:fmt(x),weekday:wd,weather,temp,rain,visitors,umbrella:umb,icecream:ice,noodle})}return out}function makeWeather(n=180){const r=rng(817),out=[],base=new Date('2026-06-01T00:00:00');for(let i=0;i<n;i++){let x=new Date(base);x.setDate(base.getDate()+i);let ds=fmt(x),temp=Math.round((22+r()*9)*10)/10,daily=r()<.30?Math.round(-Math.log(Math.max(.001,1-r()))*22):0,hourly=daily?Math.max(1,Math.round(daily*(.18+r()*.38))):0;if(ds==='2026-08-15'){daily=238;hourly=61}if(ds==='2026-08-16'){daily=326;hourly=79}if(ds==='2026-08-17'){daily=348;hourly=68}let wind=Math.round((1+r()*4+(daily>80?2:0))*10)/10,humidity=Math.round(clamp(64+(daily>0?14:0)+(r()-.5)*18,45,99));out.push({date:ds,daily,hourly,temp,wind,humidity})}return out}const STORE=makeStore(),WEATHER=makeWeather();

function labBase(l=lessons[current-1]){return (l.dataset==='store'?STORE:WEATHER).slice(0,l.limit)}function headers(l=lessons[current-1]){return l.dataset==='store'?[['date','날짜'],['weekday','요일'],['weather','날씨'],['temp','기온'],['rain','강수량'],['visitors','방문객'],['umbrella','우산'],['icecream','아이스크림'],['noodle','컵라면']]:[['date','날짜'],['daily','일강수량'],['hourly','최대시간강수량'],['temp','평균기온'],['wind','풍속'],['humidity','습도']]}function filterList(l=lessons[current-1]){return l.dataset==='store'?[['all','전체'],['sun','맑음'],['rain','비/강한 비'],['hot','25℃ 이상']]:[['all','전체'],['wet','비가 온 날'],['heavy','일강수량 50mm 이상']]}function labData(){let l=lessons[current-1],a=labBase(l);if(filter!=='all')a=a.filter(r=>l.dataset==='store'?(filter==='sun'?r.weather==='맑음':filter==='rain'?['비','강한 비'].includes(r.weather):r.temp>=25):(filter==='wet'?r.daily>0:r.daily>=50));if(sortKey)a.sort((x,y)=>{let A=x[sortKey],B=y[sortKey],d=dir==='asc'?1:-1;return typeof A==='number'?(A-B)*d:String(A).localeCompare(String(B),'ko')*d});return a}function renderLab(l){let hs=headers(l);sort.innerHTML='<option value="">정렬 열 선택</option>'+hs.map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');filt.innerHTML=filterList(l).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');metric.innerHTML=hs.filter(h=>typeof labBase(l)[0][h[0]]==='number').map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');cond.innerHTML=filterList(l).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');sort.onchange=e=>{sortKey=e.target.value;page=0;renderLab(l)};filt.onchange=e=>{filter=e.target.value;page=0;renderLab(l)};sortDir.onchange=e=>{dir=e.target.value;renderLab(l)};let a=labData(),pages=Math.max(1,Math.ceil(a.length/PAGE));page=clamp(page,0,pages-1);let s=a.slice(page*PAGE,(page+1)*PAGE);head.innerHTML='<tr>'+hs.map(h=>`<th>${h[1]}</th>`).join('')+'</tr>';body.innerHTML=s.map(r=>'<tr>'+hs.map(h=>`<td>${r[h[0]]}</td>`).join('')+'</tr>').join('');pageInfo.textContent=`${page+1}/${pages}쪽 · ${a.length}행`}function move(n){let pages=Math.max(1,Math.ceil(labData().length/PAGE));page=clamp(page+n,0,pages-1);renderLab(lessons[current-1])}function resetLab(){page=0;sortKey='';dir='asc';filter='all';renderLab(lessons[current-1])}function analyze(){let old=filter;filter=cond.value;let a=labData();filter=old;let m=metric.value,s=stat.value;if(s==='count'){res.textContent=`결과: ${a.length}행`;return}let vs=a.map(r=>Number(r[m])).filter(Number.isFinite),v=s==='avg'?vs.reduce((x,y)=>x+y,0)/vs.length:s==='max'?Math.max(...vs):Math.min(...vs);res.textContent=`결과: ${Math.round(v*10)/10}`}

const C=(()=>{let s20=STORE.slice(0,20),s60=STORE.slice(0,60),rain=s60.filter(r=>['비','강한 비'].includes(r.weather)),sun=s60.filter(r=>r.weather==='맑음'),w60=WEATHER.slice(0,60),md=Math.max(...w60.map(r=>r.daily)),mh=Math.max(...w60.map(r=>r.hourly));let ra=rain.reduce((s,r)=>s+r.umbrella,0)/rain.length,sa=sun.reduce((s,r)=>s+r.umbrella,0)/sun.length;return{maxTemp20:Math.max(...s20.map(r=>r.temp)),rainDays20:s20.filter(r=>['비','강한 비'].includes(r.weather)).length,rainUmb60:ra,sunUmb60:sa,diffUmb60:ra-sa,maxDaily60:md,maxDailyDay60:w60.find(r=>r.daily===md).date,maxHourlyDay60:w60.find(r=>r.hourly===mh).date}})();function expected(f){let x=f[4];return x?C[x]:null}function checkLesson(n){let l=lessons[n-1];[...l.pre,...l.post].forEach(f=>{let id=f[0],fb=document.getElementById('fb_'+id),v=answers[id];if(!fb)return;let target=expected(f),ok;if(f[2]==='choice')ok=String(v)===String(f[4]);else if(target!==null)ok=f[2]==='number'?Math.abs(Number(v)-Number(target))<.6:String(v||'').trim()===String(target);else ok=String(v??'').trim().length>0;fb.textContent=!String(v??'').trim()?'작성해 주세요.':ok?'✓ 확인했습니다.':'데이터를 다시 확인해 보세요.';fb.className='feedback '+(ok?'ok':'no')})}
function shareHTML(l){let d=drafts[l.n]||{},text=d.text||((l.share.source&&answers[l.share.source])?answers[l.share.source]:'');let extra='';if(l.share.poll)extra=`<div class="field"><label>나의 선택</label><select id="shareDecision"><option>늘린다</option><option>유지한다</option><option>줄인다</option></select></div>`;return `<div class="sharegrid"><div><strong>${l.share.title}</strong><p class="small">${l.share.prompt}</p>${extra}<div class="field"><label>${l.share.custom?'공유할 내용':'나의 한 문장'}</label><textarea id="shareText" oninput="saveShareDraft(this.value)">${esc(text)}</textarea></div><div class="row"><button class="btn secondary" onclick="saveShareDraft(shareText.value,true)">임시 저장</button><button class="btn green" onclick="publishShare()">우리 반에 공유</button></div><div id="shareState" class="status">${API?'우리 반 게시판 연결됨':'공유 서버 미연결 · 임시 저장은 가능'}</div></div><div><strong>친구 생각 보기</strong><p class="small">좋은 질문이나 근거를 발견하면 좋아요를 눌러 보세요.</p><button class="btn secondary" onclick="loadPosts()">새로고침</button><div id="poll"></div></div></div><div id="gallery" class="gallery"></div>`}function saveShareDraft(v,toast){drafts[current]=drafts[current]||{};drafts[current].text=v;saveDraft();if(toast)alert('내 기기에 임시 저장했습니다.')}function jsonp(url){return new Promise((resolve,reject)=>{let cb='cb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),t=setTimeout(()=>{cleanup();reject(new Error('timeout'))},10000);function cleanup(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('load'))};s.src=url+(url.includes('?')?'&':'?')+'action=shares&token='+encodeURIComponent(TOKEN)+'&className='+encodeURIComponent(profile.studentClass)+'&lesson='+current+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s)})}async function loadPosts(){let g=document.getElementById('gallery');if(!g)return;if(!API||!TOKEN){g.innerHTML='<div class="empty">선생님이 공유 서버를 연결하면 우리 반 친구들의 글이 여기에 나타납니다.</div>';return}g.innerHTML='<div class="empty">불러오는 중...</div>';try{let d=await jsonp(API);if(!d.ok)throw new Error(d.error||'error');let items=d.items||[];if(!items.length){g.innerHTML='<div class="empty">아직 공유된 글이 없습니다. 첫 번째로 공유해 보세요!</div>';return}g.innerHTML=items.slice(0,12).map(p=>`<div class="post"><div class="meta">${esc(p.name)} · ${new Date(p.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div><h4>${esc(p.title||lessons[current-1].share.title)}</h4><div>${esc(p.text)}</div><div class="row" style="margin-top:8px"><button class="like" onclick="likePost('${esc(p.id)}')">👍 ${p.likes||0}</button></div></div>`).join('');if(lessons[current-1].share.poll){let c={늘린다:0,유지한다:0,줄인다:0};items.forEach(p=>{let x=p.extra?.decision;if(c[x]!==undefined)c[x]++});poll.innerHTML='<div class="poll">'+Object.entries(c).map(([k,v])=>`<div><strong>${k}</strong><br>${v}명</div>`).join('')+'</div>'}}catch(e){g.innerHTML='<div class="empty">공유 글을 불러오지 못했습니다. 잠시 후 다시 시도하세요.</div>'}}
async function publishShare(){let text=document.getElementById('shareText')?.value.trim()||'';if(!text){alert('공유할 내용을 먼저 작성하세요.');return}saveShareDraft(text);if(!API||!TOKEN){alert('공유 서버가 연결되지 않았습니다. 내용은 내 기기에 저장했습니다.');return}let l=lessons[current-1],extra=l.share.poll?{decision:document.getElementById('shareDecision').value}:{};try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOKEN,type:'share',profile,lesson:current,kind:l.share.kind,title:l.share.title,text,extra})});shareState.textContent='공유 요청을 보냈습니다. 잠시 후 새로고침하세요.';setTimeout(loadPosts,1000)}catch(e){alert('공유하지 못했습니다. 임시 저장은 되어 있습니다.')}}async function likePost(id){if(!API||!TOKEN)return;try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOKEN,type:'like',profile,postId:id})});setTimeout(loadPosts,600)}catch(e){}}
function completeLesson(n){let l=lessons[n-1],all=[...l.pre,...l.post],miss=all.filter(f=>answers[f[0]]===undefined||String(answers[f[0]]).trim()==='');if(miss.length){alert(`아직 작성하지 않은 활동이 ${miss.length}개 있습니다.`);checkLesson(n);return}done.add(n);saveDone();n===8?showSubmit():showHome()}function summaryText(){let a=[`학생: ${profile.studentClass} ${profile.studentNo}번 ${profile.studentName}`,`완료 차시: ${[...done].sort((x,y)=>x-y).join(', ')||'없음'}`,''];lessons.forEach(l=>{a.push(`[${l.n}차시] ${l.title}`);[...l.pre,...l.post].forEach(f=>{let v=answers[f[0]]??'';if(f[2]==='choice'&&v!=='')v=f[3][Number(v)]||v;a.push(`${f[1]}: ${v}`)});a.push('')});return a.join('\n')}function showSubmit(){showOnly('submit');submitStatus.textContent=`${profile.studentClass} ${profile.studentNo}번 ${profile.studentName} · ${done.size}/8차시 완료`;summary.textContent=summaryText()}renderHome();let lessonQ=Number(new URLSearchParams(location.search).get('lesson')||0);if(lessonQ>=1&&lessonQ<=8)openLesson(lessonQ);
</script></body></html>
