<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터로 발견하는 우리 생활</title><style>:root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#667085;--primary:#2563eb;--ok:#15803d;--bad:#b91c1c;--blue:#e8f2ff;--purple:#f0eaff;--green:#ebf8ee;--teal:#e9f7f7;--orange:#fff2e8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#ffffffef;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin,.wrap{max-width:1120px;margin:auto}.topin{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.brand small{display:block;font-size:11px;color:var(--muted)}.wrap{padding:24px 16px 72px}.hero,.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:22px}.hero{padding:30px;background:linear-gradient(135deg,#eaf3ff,#fff 62%,#f4ecf7)}.hero h1{font-size:clamp(31px,5vw,52px);line-height:1.08;letter-spacing:-.05em;margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#344054;font-weight:900;font-size:12px}.btn{border:0;border-radius:12px;padding:9px 13px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary{background:var(--primary);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#344054}.success{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.row{display:flex;gap:8px;flex-wrap:wrap}.student{background:#ecfdf3;border:1px solid #bbf7d0;border-radius:12px;padding:9px 11px;font-weight:900;color:#166534}.small{font-size:13px;color:var(--muted)}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.card{padding:18px}.card.done{background:#f0fdf4;border-color:#86efac}.card h3{margin:7px 0}.hidden{display:none!important}.panel{padding:24px}.block{border-radius:16px;padding:16px;margin:12px 0}.q{background:var(--blue)}.together{background:var(--purple)}.do{background:var(--green)}.wrapup{background:var(--teal)}.next{background:var(--orange)}.challenge{background:#fff8e7;border-left:4px solid #f59e0b}.field{margin:13px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:10px;background:#fff}.field textarea{min-height:82px;resize:vertical}.feedback{font-size:13px;font-weight:800;margin-top:4px}.feedback.ok{color:var(--ok)}.feedback.no{color:var(--bad)}.lessonnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.lab{border:1px solid #bfd4ea;background:#fbfdff;border-radius:17px;padding:15px;margin:14px 0}.lab-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin:10px 0}.controls select,.analysis select,.controls button,.analysis button{border:1px solid #cbd5e1;border-radius:10px;padding:8px;background:#fff}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}.tbl{border-collapse:collapse;width:100%;min-width:840px;font-size:12px}.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid #edf0f3;text-align:center}.tbl th{background:#f3f4f6;position:sticky;top:0}.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}.analysis{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin-top:10px}.result{font-weight:900;color:#1f4e78;margin-top:7px}.chart{margin-top:12px}.chart canvas{width:100%;height:300px;border:1px solid var(--line);border-radius:12px;background:#fff}.status{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{padding:5px 9px;border-radius:999px;background:#f2f4f7;font-size:12px;font-weight:800}.summary{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:360px;overflow:auto}.topbuttons{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:760px){.grid,.controls,.analysis{grid-template-columns:1fr}.topbuttons{display:none}.hero,.panel{padding:20px}}</style></head><body><header class="top"><div class="topin"><div class="brand">데이터로 발견하는 우리 생활<small>공통 수업 8차시</small></div><div class="topbuttons"><button class="btn secondary" onclick="showHome()">홈</button><a class="btn secondary" href="./practice.html">혼자 연습</a><button class="btn secondary" onclick="showSubmit()">기록 확인</button></div></div></header><main class="wrap"><section id="home"><div class="hero"><span class="badge">편의점으로 배우고 → 거제 날씨에 적용하기</span><h1>데이터를 보고<br>근거를 찾아 결정해 보자</h1><p>작은 데이터에서 시작해 20행 → 60행 → 240행으로 늘려가며 정렬·필터·평균·그래프가 왜 필요한지 직접 경험합니다.</p><div id="studentInfo" class="student"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="openLesson(1)">수업 시작</button><a class="btn secondary" href="./start.html">학생 정보 변경</a><a class="btn success" href="./practice.html">급식·거제중학교 혼자 연습</a></div><div class="progress"><div id="bar"></div></div><div id="prog" class="small"></div></div><div id="cards" class="grid"></div></section><section id="lesson" class="hidden"><div id="box" class="panel"></div></section><section id="submit" class="hidden"><div class="panel"><span class="badge">학습 기록</span><h2>공통 수업 활동 확인</h2><div id="status" class="status"></div><div id="summary" class="summary"></div><div class="row" style="margin-top:14px"><a class="btn primary" href="./practice.html">혼자 연습 후 제출하기</a><button class="btn secondary" onclick="showHome()">← 홈</button></div></div></section></main><script>
const PROFILE_KEY='data-classroom-profile-v8',STORE_KEY='data-classroom-answers-v8',DONE_KEY='data-classroom-done-v8';let profile={};try{profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(e){}function validProfile(p){return !!(p.studentClass&&p.studentNo&&p.studentName)}if(!validProfile(profile)){location.replace('./start.html?next=common'+(location.search?'&'+location.search.slice(1):''))}
function rng(seed){let s=seed>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function fmt(d){return d.toISOString().slice(0,10)}function dow(d){return ['일','월','화','수','목','금','토'][d.getDay()]}function makeStore(n=240){const r=rng(20260825),out=[],base=new Date('2026-04-01T00:00:00');for(let i=0;i<n;i++){let x=new Date(base);x.setDate(base.getDate()+i);let m=x.getMonth()+1,temp=Math.round(clamp(15+(m-4)*2.8+(r()-.5)*7,8,36)*10)/10,rainy=r()<(.18+(m>=6&&m<=8?.14:.03)),heavy=rainy&&r()<.12,rain=rainy?Math.round((heavy?35:1)+r()*(heavy?75:28)):0,weather=heavy?'강한 비':rainy?'비':r()<.18?'흐림':'맑음',wd=dow(x),week=['토','일'].includes(wd),visitors=Math.max(70,Math.round(145+(week?30:0)+Math.max(temp-18,0)*1.8-rain*.22+(r()-.5)*38)),umb=Math.max(0,Math.round((rainy?8+rain*.28:.6)+(r()-.5)*4)),ice=Math.max(1,Math.round(3+Math.max(temp-18,0)*2.7-(rainy?7:0)+(r()-.5)*9)),noodle=Math.max(3,Math.round(10+(rainy?8:0)+(r()-.5)*7)),sales=Math.round((visitors*3000+umb*6500+ice*1800+noodle*1500)/1000)*1000;out.push({date:fmt(x),weekday:wd,weather,temp,rain,visitors,umbrella:umb,icecream:ice,noodle,sales})}return out}function makeWeather(n=180){const r=rng(817),out=[],base=new Date('2026-06-01T00:00:00');for(let i=0;i<n;i++){let x=new Date(base);x.setDate(base.getDate()+i);let ds=fmt(x),temp=Math.round((22+r()*9)*10)/10,daily=r()<.30?Math.round(-Math.log(Math.max(.001,1-r()))*22):0,hourly=daily?Math.max(1,Math.round(daily*(.18+r()*.38))):0;if(ds==='2026-08-15'){daily=238;hourly=61}if(ds==='2026-08-16'){daily=326;hourly=79}if(ds==='2026-08-17'){daily=348;hourly=68}let wind=Math.round((1+r()*4+(daily>80?2:0))*10)/10,humidity=Math.round(clamp(64+(daily>0?14:0)+(r()-.5)*18,45,99));out.push({date:ds,daily,hourly,temp,wind,humidity})}return out}const STORE=makeStore(),WEATHER=makeWeather();
const lessons=[
{n:1,title:'편의점에도 데이터가 있을까?',size:'생활 속 예시',q:'내가 물건을 하나 사면 어떤 데이터가 생길까?',goal:'생활 속 데이터와 디지털 데이터의 가치를 이해해요.',together:'편의점에서 물건을 산 상황을 떠올려 어떤 기록이 생기는지 함께 찾아봅니다.',fields:[['l1a','구매하면서 생길 수 있는 데이터 3가지','textarea'],['l1b','숫자 데이터 한 가지','text'],['l1c','문자 데이터 한 가지','text'],['l1d','종이보다 디지털로 저장하면 좋은 점','textarea'],['l1e','오늘 학교에서 내가 만든 데이터 한 가지','text']],challenge:'편의점이 판매 기록을 한 달 동안 모으면 새롭게 알 수 있는 것은 무엇일까요?',wrap:'데이터는 모이고 정리될수록 비교·분석하여 판단에 활용할 수 있어요.'},
{n:2,title:'내일 비가 온다면 무엇을 준비해야 할까?',size:'문제 정의',q:'답을 정하려면 어떤 데이터가 필요할까?',goal:'예상과 데이터 근거를 구분하고 탐구 질문을 만들어요.',together:'“비가 오면 우산이 잘 팔릴 것 같다”는 예상입니다. 실제 판매 기록에서 확인하려면 필요한 데이터를 골라야 합니다.',fields:[['l2a','비 오는 날 더 많이 팔릴 것 같은 상품','text'],['l2b','그렇게 예상한 이유','textarea'],['l2c','확인에 필요한 데이터 3~5개','textarea'],['l2d','좋은 데이터 질문은?','choice',['편의점은 좋은 곳인가?','비 오는 날과 맑은 날의 평균 우산 판매량은 얼마나 다른가?','사람들은 왜 비를 싫어할까?'],1],['l2e','내가 만든 데이터 탐구 질문','textarea']],challenge:'같은 질문에 답하려면 최소 며칠 정도의 기록이 있어야 믿을 만할지 생각해 보세요.',wrap:'좋은 탐구 질문은 데이터로 확인할 수 있고 비교 대상이 분명해요.'},
{n:3,title:'20행 데이터부터 살펴보자',size:'편의점 20행',q:'작은 표에서 행과 열은 무엇을 뜻할까?',goal:'행·열을 이해하고 정렬·필터를 사용할 수 있어요.',together:'처음에는 20행만 봅니다. 한 행은 하루의 기록이고, 한 열은 같은 종류의 특징입니다.',dataset:'store',limit:20,fields:[['l3a','이 표에서 한 행은 무엇을 뜻할까?','choice',['하루의 편의점 기록','상품 하나의 가격표','한 달 평균'],0],['l3b','이 표에서 한 열은 무엇을 뜻할까?','textarea'],['l3c','가장 높은 기온(℃)','number','maxTemp20'],['l3d','비 또는 강한 비가 온 날은 며칠?','number','rainDays20'],['l3e','범주형 데이터 한 가지와 수치형 데이터 한 가지','textarea']],challenge:'20행 정도라면 눈으로 찾을 수도 있습니다. 데이터가 200행이면 어떤 점이 불편할까요?',wrap:'작은 데이터에서 정렬·필터의 기본 사용법을 익혔어요.'},
{n:4,title:'60행에서 두 집단을 비교하자',size:'편의점 60행',q:'비 오는 날과 맑은 날의 우산 판매량은 정말 다를까?',goal:'조건별 평균을 구하고 두 집단을 비교해요.',together:'60행부터는 눈으로 하나씩 세기 어렵습니다. 조건을 나누고 평균으로 대표값을 비교합니다.',dataset:'store',limit:60,fields:[['l4a','비/강한 비 날의 평균 우산 판매량','number','rainUmb60'],['l4b','맑은 날의 평균 우산 판매량','number','sunUmb60'],['l4c','두 평균의 차이(약 몇 개?)','number','diffUmb60'],['l4d','비/강한 비 날의 평균 아이스크림 판매량','number','rainIce60'],['l4e','맑은 날의 평균 아이스크림 판매량','number','sunIce60'],['l4f','두 비교에서 발견한 사실을 한 문장으로','textarea']],challenge:'우산과 아이스크림의 결과가 반대로 나타난다면 그 이유를 데이터 범위 안에서 어떻게 표현할까요?',wrap:'평균은 여러 값을 하나의 대표값으로 요약해 집단을 비교하도록 도와줘요.'},
{n:5,title:'240행을 그래프로 바꾸자',size:'편의점 240행',q:'데이터가 많아지면 어떻게 특징을 빠르게 볼 수 있을까?',goal:'비교·변화·관계에 맞는 그래프를 선택하고 해석해요.',together:'240행에서는 표만으로 패턴을 찾기 어렵습니다. 그래프를 사용해 차이와 관계를 한눈에 봅니다.',dataset:'store',limit:240,chart:true,fields:[['l5a','날씨별 평균 우산 판매량 비교에 적절한 그래프','choice',['막대그래프','꺾은선그래프','산점도'],0],['l5b','날짜별 방문객 수 변화에 적절한 그래프','choice',['막대그래프','꺾은선그래프','산점도'],1],['l5c','기온과 아이스크림 판매량 관계에 적절한 그래프','choice',['막대그래프','꺾은선그래프','산점도'],2],['l5d','그래프에서 발견한 사실 1','textarea'],['l5e','그래프에서 발견한 사실 2','textarea'],['l5f','그래프만 보고 원인이라고 단정하면 안 되는 이유','textarea']],challenge:'같은 데이터라도 그래프 종류를 잘못 선택하면 어떤 오해가 생길 수 있을까요?',wrap:'그래프는 질문에 맞게 골라야 데이터의 차이·변화·관계를 정확히 볼 수 있어요.'},

let state=JSON.parse(localStorage.getItem(STORE_KEY)||'{}'),done=new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]')),current=1,page=0,sortKey='',asc=true,filter='all';const PAGE=15;function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function attr(s){return String(s??'').replace(/"/g,'&quot;')}function showOnly(id){['home','lesson','submit'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function showHome(){showOnly('home');renderHome()}function renderHome(){studentInfo.textContent=`${profile.studentClass} ${profile.studentNo}번 ${profile.studentName}`;cards.innerHTML=lessons.map(l=>`<div class="card ${done.has(l.n)?'done':''}"><span class="badge">${l.n}차시 · ${l.size}</span><h3>${l.title}</h3><p class="small">${l.q}</p><button class="btn ${done.has(l.n)?'success':'primary'}" onclick="openLesson(${l.n})">${done.has(l.n)?'다시 보기':'시작하기'}</button></div>`).join('');bar.style.width=(done.size/8*100)+'%';prog.textContent=`학습 진행 ${done.size}/8차시 · 필수 활동을 모두 작성해야 차시가 완료됩니다.`}
function fieldHTML(f){let [id,label,type,extra]=f,v=state[id]??'';if(type==='choice')return `<div class="field"><label>${label}</label><select id="${id}" onchange="setField('${id}',this.value)"><option value="">선택하세요</option>${extra.map((c,i)=>`<option value="${i}" ${String(v)===String(i)?'selected':''}>${c}</option>`).join('')}</select><div id="fb_${id}" class="feedback"></div></div>`;if(type==='textarea')return `<div class="field"><label>${label}</label><textarea id="${id}" oninput="setField('${id}',this.value)">${esc(v)}</textarea><div id="fb_${id}" class="feedback"></div></div>`;return `<div class="field"><label>${label}</label><input id="${id}" type="${type==='number'?'number':'text'}" step="any" value="${attr(v)}" oninput="setField('${id}',this.value)"><div id="fb_${id}" class="feedback"></div></div>`}function setField(id,v){state[id]=v;save();let fb=document.getElementById('fb_'+id);if(fb){fb.textContent=String(v).trim()?'✓ 저장됨':'작성해 주세요.';fb.className='feedback '+(String(v).trim()?'ok':'no')}}function openLesson(n){current=n;page=0;sortKey='';asc=true;filter='all';let l=lessons[n-1];showOnly('lesson');box.innerHTML=`<span class="badge">${n}차시 · ${l.size}</span><h2>${l.title}</h2><p class="small">오늘의 목표: ${l.goal}</p><div class="block q"><h3>❓ 오늘의 질문</h3><strong>${l.q}</strong></div><div class="block together"><h3>👩‍🏫 선생님과 같이</h3>${l.together}</div>${l.dataset?labHTML(l):''}<div class="block do"><h3>✍️ 필수 활동</h3>${l.fields.map(fieldHTML).join('')}<button class="btn secondary" onclick="checkLesson()">내 답 확인</button></div><div class="block challenge"><h3>⭐ 도전 활동 · 선택</h3><p>${l.challenge}</p><textarea style="width:100%;min-height:72px;border:1px solid #d1d5db;border-radius:10px;padding:9px" oninput="setField('c${n}',this.value)">${esc(state['c'+n]||'')}</textarea></div><div class="block wrapup"><h3>✅ 오늘의 핵심</h3>${l.wrap}</div><div class="lessonnav"><button class="btn secondary" onclick="${n===1?'showHome()':`openLesson(${n-1})`}">← 이전</button><button class="btn primary" onclick="completeLesson()">${n}차시 완료</button><button class="btn secondary" onclick="${n===8?'showSubmit()':`openLesson(${n+1})`}">${n===8?'기록 확인':'다음 →'}</button></div>`;if(l.dataset)renderLab();if(l.chart)setTimeout(drawChart,30)}
function dataOf(l){return (l.dataset==='store'?STORE:WEATHER).slice(0,l.limit)}function heads(l){return l.dataset==='store'?[['date','날짜'],['weekday','요일'],['weather','날씨'],['temp','기온(℃)'],['rain','강수량(mm)'],['visitors','방문객'],['umbrella','우산'],['icecream','아이스크림'],['noodle','컵라면'],['sales','총매출(원)']]:[['date','날짜'],['daily','일강수량(mm)'],['hourly','최대시간강수량(mm)'],['temp','평균기온(℃)'],['wind','풍속(m/s)'],['humidity','습도(%)']]}
function labHTML(l){return `<div class="lab"><div class="lab-head"><div><h3>🔎 데이터 실험실</h3><div class="small">${l.size} · 한 번에 15행씩 보여줍니다.</div></div><span class="badge">${l.dataset==='store'?'편의점':'거제 날씨'}</span></div><div class="controls"><select id="sort"></select><select id="filt"></select><select id="dir"><option value="asc">오름차순</option><option value="desc">내림차순</option></select><button onclick="resetLab()">초기화</button></div><div class="tablewrap"><table class="tbl"><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="pager"><button class="btn secondary" onclick="move(-1)">← 이전 15행</button><span id="pageInfo" class="small"></span><button class="btn secondary" onclick="move(1)">다음 15행 →</button></div><div class="analysis"><select id="metric"></select><select id="cond"></select><select id="stat"><option value="avg">평균</option><option value="max">최댓값</option><option value="min">최솟값</option><option value="count">개수</option></select><button onclick="analyze()">분석</button></div><div id="res" class="result"></div>${l.chart?`<div class="chart"><div class="row"><select id="chartPreset" style="padding:8px;border:1px solid #cbd5e1;border-radius:10px">${l.dataset==='store'?'<option value="umb">맑음/비 평균 우산</option><option value="vis">날짜별 방문객</option><option value="ice">기온-아이스크림</option>':'<option value="daily">날짜별 일강수량</option><option value="hourly">날짜별 최대 시간당 강수량</option>'}</select><button class="btn secondary" onclick="drawChart()">그래프 그리기</button></div><canvas id="chartCanvas" width="900" height="300"></canvas></div>`:''}</div>`}
function filters(l){return l.dataset==='store'?[['all','전체'],['sun','맑음'],['rain','비/강한 비'],['hot','25℃ 이상']]:[['all','전체'],['wet','비가 온 날'],['heavy','일강수량 50mm 이상']]}function labData(){let l=lessons[current-1],a=dataOf(l).slice();if(filter!=='all')a=a.filter(r=>l.dataset==='store'?(filter==='sun'?r.weather==='맑음':filter==='rain'?['비','강한 비'].includes(r.weather):r.temp>=25):(filter==='wet'?r.daily>0:r.daily>=50));if(sortKey)a.sort((x,y)=>{let A=x[sortKey],B=y[sortKey];return typeof A==='string'?(asc?String(A).localeCompare(String(B)):String(B).localeCompare(String(A))):(asc?A-B:B-A)});return a}function renderLab(){let l=lessons[current-1],hs=heads(l);sort.innerHTML='<option value="">정렬 열 선택</option>'+hs.map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');filt.innerHTML=filters(l).map(x=>`<option value="${x[0]}" ${filter===x[0]?'selected':''}>${x[1]}</option>`).join('');metric.innerHTML=hs.filter(h=>typeof dataOf(l)[0][h[0]]==='number').map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('');cond.innerHTML=filters(l).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');sort.onchange=e=>{sortKey=e.target.value;page=0;renderLab()};filt.onchange=e=>{filter=e.target.value;page=0;renderLab()};dir.onchange=e=>{asc=e.target.value==='asc';renderLab()};let a=labData(),pages=Math.max(1,Math.ceil(a.length/PAGE));page=Math.min(page,pages-1);let sl=a.slice(page*PAGE,(page+1)*PAGE);head.innerHTML='<tr>'+hs.map(h=>`<th>${h[1]}</th>`).join('')+'</tr>';body.innerHTML=sl.map(r=>'<tr>'+hs.map(h=>`<td>${r[h[0]]}</td>`).join('')+'</tr>').join('');pageInfo.textContent=`${page+1}/${pages}쪽 · ${a.length}행`}function move(n){let pages=Math.max(1,Math.ceil(labData().length/PAGE));page=clamp(page+n,0,pages-1);renderLab()}function resetLab(){page=0;sortKey='';asc=true;filter='all';renderLab()}function condData(){let old=filter;filter=cond.value;let a=labData();filter=old;return a}function analyze(){let a=condData(),m=metric.value,s=stat.value;if(s==='count'){res.textContent=`결과: ${a.length}행`;return}let vs=a.map(r=>Number(r[m])).filter(Number.isFinite),v=s==='avg'?vs.reduce((x,y)=>x+y,0)/vs.length:s==='max'?Math.max(...vs):Math.min(...vs);res.textContent=`결과: ${Math.round(v*10)/10}`}
function drawChart(){let c=document.getElementById('chartCanvas');if(!c)return;let ctx=c.getContext('2d'),l=lessons[current-1],a=dataOf(l),p=chartPreset.value;ctx.clearRect(0,0,900,300);ctx.fillStyle='#fff';ctx.fillRect(0,0,900,300);ctx.strokeStyle='#cbd5e1';ctx.strokeRect(55,35,790,210);ctx.fillStyle='#334155';ctx.font='14px sans-serif';if(l.dataset==='store'&&p==='umb'){let g=[a.filter(r=>r.weather==='맑음'),a.filter(r=>['비','강한 비'].includes(r.weather))],v=g.map(x=>x.reduce((s,r)=>s+r.umbrella,0)/x.length),mx=Math.max(...v)*1.2;['맑음','비/강한 비'].forEach((lab,i)=>{let h=170*v[i]/mx,x=230+i*330;ctx.fillStyle=i?'#86efac':'#93c5fd';ctx.fillRect(x,235-h,130,h);ctx.fillStyle='#334155';ctx.fillText(lab,x+25,260);ctx.fillText((Math.round(v[i]*10)/10)+'개',x+35,225-h)})}else if(l.dataset==='store'&&p==='ice'){let xs=a.map(r=>r.temp),ys=a.map(r=>r.icecream),xmin=Math.min(...xs),xmax=Math.max(...xs),ymax=Math.max(...ys);ctx.fillStyle='#7c3aed';a.forEach(r=>{let x=65+(r.temp-xmin)/(xmax-xmin||1)*760,y=235-r.icecream/(ymax||1)*175;ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill()})}else{let key=l.dataset==='weather'?(p==='hourly'?'hourly':'daily'):'visitors',sample=a.filter((_,i)=>i%Math.max(1,Math.floor(a.length/45))===0),ys=sample.map(r=>r[key]),mn=Math.min(...ys),mx=Math.max(...ys);ctx.beginPath();sample.forEach((r,i)=>{let x=65+i*(760/Math.max(1,sample.length-1)),y=235-(r[key]-mn)/(mx-mn||1)*175;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.stroke()}}
const C=(()=>{let s20=STORE.slice(0,20),s60=STORE.slice(0,60),rain=s60.filter(r=>['비','강한 비'].includes(r.weather)),sun=s60.filter(r=>r.weather==='맑음'),w60=WEATHER.slice(0,60),md=Math.max(...w60.map(r=>r.daily)),mh=Math.max(...w60.map(r=>r.hourly));let ru=rain.reduce((s,r)=>s+r.umbrella,0)/rain.length,su=sun.reduce((s,r)=>s+r.umbrella,0)/sun.length,ri=rain.reduce((s,r)=>s+r.icecream,0)/rain.length,si=sun.reduce((s,r)=>s+r.icecream,0)/sun.length;return{maxTemp20:Math.max(...s20.map(r=>r.temp)),rainDays20:s20.filter(r=>['비','강한 비'].includes(r.weather)).length,rainUmb60:ru,sunUmb60:su,diffUmb60:Math.abs(ru-su),rainIce60:ri,sunIce60:si,maxDaily60:md,maxDailyDay60:w60.find(r=>r.daily===md).date,maxHourly60:mh,maxHourlyDay60:w60.find(r=>r.hourly===mh).date}})();function checkLesson(){let l=lessons[current-1];l.fields.forEach(f=>{let [id,,type,extra]=f,v=state[id],fb=document.getElementById('fb_'+id),ok=false;if(type==='choice')ok=String(v)===String(extra);else if(extra&&C[extra]!==undefined)ok=type==='number'?Math.abs(Number(v)-Number(C[extra]))<.6:String(v||'').trim()===String(C[extra]);else ok=String(v||'').trim().length>0;fb.textContent=!String(v??'').trim()?'아직 작성하지 않았어요.':ok?'✓ 확인했습니다.':'데이터를 다시 확인해 보세요.';fb.className='feedback '+(ok?'ok':'no')})}function completeLesson(){let l=lessons[current-1],miss=l.fields.filter(f=>state[f[0]]===undefined||String(state[f[0]]).trim()==='');if(miss.length){alert(`필수 활동 ${miss.length}개가 남아 있습니다.`);checkLesson();return}done.add(current);localStorage.setItem(DONE_KEY,JSON.stringify([...done]));current===8?showSubmit():showHome()}function summaryText(){let x=[`학생: ${profile.studentClass} ${profile.studentNo}번 ${profile.studentName}`,`완료 차시: ${[...done].sort((a,b)=>a-b).join(', ')||'없음'}`,''];lessons.forEach(l=>{x.push(`[${l.n}차시] ${l.title}`);l.fields.forEach(f=>x.push(`${f[1]}: ${state[f[0]]??''}`));if(state['c'+l.n])x.push(`도전 활동: ${state['c'+l.n]}`);x.push('')});return x.join('\n')}function showSubmit(){showOnly('submit');let fields=lessons.flatMap(l=>l.fields),filled=fields.filter(f=>String(state[f[0]]??'').trim()).length;status.innerHTML=`<span class="pill">완료 ${done.size}/8차시</span><span class="pill">필수 활동 ${filled}/${fields.length}</span><span class="pill">${profile.studentClass} ${profile.studentNo}번 ${profile.studentName}</span>`;summary.textContent=summaryText()}renderHome();</script></body></html>
